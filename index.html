      answer: `①ResourceManager 负责全局资源与调度，NodeManager 管理单机 Container，ApplicationMaster 管理单个应用生命周期。②客户端提交应用包后，RM 先分配 Container 启动 AM；AM 注册并按任务需求申请资源。③NM 启动任务 Container，AM 跟踪重试，完成后注销。资源按内存、CPU 等容器化分配。`,
      detail: `RM 内部常分 ApplicationsManager 和 Scheduler，后者只做资源分配，不负责业务任务容错。不同计算框架拥有自己的 AM。Capacity/Fair Scheduler 用队列、配额与抢占实现多租户隔离，排查排队需看队列上限和 AM 资源。`,
      followUp: [{ q: "ApplicationMaster 失败会怎样？", a: "RM 检测到 AM 失联后按重试策略在新 Container 里重启它（有次数上限）；新 AM 重建任务状态，能否保留已完成 task 取决于框架的恢复能力；答出“AM 是应用单点但有重试与恢复机制兜底”就完整了。" }, { q: "YARN 的 Container 和 Docker 容器一样吗？", a: "不一样：YARN Container 本质是资源抽象（多少内存、多少 CPU）加进程启动描述，隔离强度取决于实现（进程级、cgroup，新版可配 Docker 运行时）；Docker 是镜像加命名空间的完整隔离体系——别把资源配额当成虚拟化。" }], tags: ["YARN", "ResourceManager", "ApplicationMaster"]
    },
    {
      id: "CMP-004", category: "大数据组件原理", question: "MapReduce Shuffle 的完整过程是什么？", frequency: 5,
      answer: `①Map 输出先进入环形缓冲区，达到阈值后按分区排序并 Spill，本地多段再归并，可选 Combiner 和压缩。②Reduce 通过网络拉取属于自己的各 Map 分区，在内存和磁盘归并排序。③相同 key 分组后调用 reduce 写出。Shuffle 核心包括分区、排序、溢写、拷贝、归并，是网络与磁盘开销中心。`,
      detail: `Partitioner 决定 key 去哪个 Reducer，排序保证同 Reducer 内 key 有序，GroupingComparator 决定哪些 key 作为一组。Combiner 只适用于满足结合律、交换律且输入输出类型兼容的操作，执行次数不确定，不能用于求平均的最终逻辑。`,
      followUp: [{ q: "Combiner 为什么不能保证执行？", a: "Combiner 是纯优化不是语义保证：框架可在各次 spill 前后执行零到多次，取决于溢出情况；所以业务逻辑不能依赖它——只有满足结合律交换律且输入输出类型一致的操作（sum、max）才安全，平均值必须拆成 sum 加 count。" }, { q: "Reduce 数如何影响 Shuffle？", a: "Reduce 数就是分区数：太少则单个 reduce 数据量大、并行度不足、输出文件巨大；太多则每个 map 要切更多分区、小文件变多、归并与连接开销上升；按数据量与槽位估算，并注意倾斜会让“平均分”失效。" }], tags: ["MapReduce", "Shuffle", "Spill", "Combiner"]
    },
    {
      id: "CMP-005", category: "大数据组件原理", question: "Hive SQL 从提交到执行经历哪些环节？", frequency: 5,
      answer: `①Driver 接收 SQL，经 Parser 生成 AST，语义分析结合 Metastore 校验表、列和类型，形成逻辑计划。②优化器执行分区裁剪、谓词下推、列裁剪、Join 重排等规则与成本优化，生成物理计划。③计划提交 Tez、Spark 或 MapReduce 执行，任务读写 HDFS，结果返回或落表。Hive 本身主要提供 SQL 与元数据层。`,
      detail: `Metastore 保存表 Schema、分区和统计信息，不保存实际数据。执行引擎决定 DAG 与运行方式。EXPLAIN 可查看计划，ANALYZE 收集的统计信息影响 CBO。HiveServer2 提供会话、认证和 JDBC 接入。`,
      followUp: [{ q: "Hive 元数据存在哪里？", a: "Metastore 服务加后端关系库（MySQL/PostgreSQL）：表结构、分区信息、列统计都在 RDBMS 里，Metastore 提供统一访问服务；数据本体在 HDFS 或对象存储——所以 Metastore 后端库是核心资产，必须高可用加备份。" }, { q: "语法树和执行 DAG 有什么区别？", a: "阶段与形态不同：AST 忠实于 SQL 文本的语法结构，经语义分析和优化器后才生成逻辑、物理计划；DAG 是物理执行层的算子有向图（节点是 Map/Reduce 阶段，边是 Shuffle）；同一棵 AST 可以被优化成不同 DAG。" }], tags: ["Hive", "执行原理", "优化器", "Metastore"]
    },
    {
      id: "CMP-006", category: "大数据组件原理", question: "Spark 相比 MapReduce 为什么更快？它一定更快吗？", frequency: 5,
      answer: `①Spark 以 DAG 切分 Stage，将可流水执行的窄依赖合并，减少 MapReduce 每轮固定落盘与作业启动开销。②中间数据可缓存内存，适合迭代计算和交互分析，并有更丰富执行优化。③它并非总更快：内存不足会 Spill，简单一次性超大批处理差距有限；性能仍取决于算法、倾斜、序列化和资源配置。`,
      detail: `MapReduce 通常每个作业 Map、Shuffle、Reduce 后把结果落 HDFS，多步流程开销大；Spark 只在宽依赖处分 Stage，Stage 内算子管道执行。Spark 的内存计算不是“所有数据必须在内存”，不足时会落盘并重算丢失分区。`,
      followUp: [{ q: "什么是窄依赖和宽依赖？", a: "看子分区与父分区的对应关系：窄依赖是一对一或固定少量（map、filter），可在同一 Stage 内流水线执行；宽依赖是多对多、需按 key 重新分区（groupBy、join），构成 Stage 边界并触发 Shuffle；两者的容错重算代价也完全不同。" }, { q: "Spark 内存不足会发生什么？", a: "降级而非失败：缓存按策略逐出或选择不缓存，Shuffle 与聚合数据 Spill 到磁盘，丢失的分区按血统重算；代价是性能下降，极端配置下才会 OOM——面试要纠正“Spark 等于全内存计算”的误解。" }], tags: ["Spark", "MapReduce", "DAG", "内存计算"]
    },
    {
      id: "CMP-007", category: "大数据组件原理", question: "Spark Shuffle 为什么发生？常见优化方向有哪些？", frequency: 5,
      answer: `①宽依赖算子需要按 key 重新分区，如 groupByKey、reduceByKey、join、distinct 和 repartition，因此发生 Shuffle。②Map 端按分区写文件，Reduce 端拉取、聚合并可能 Spill。③优化优先过滤、预聚合和 map-side combine，再选合理分区数、序列化与压缩，并处理倾斜。`,
      detail: `reduceByKey 比 groupByKey 更优，因为能在 Map 端先合并。Spark SQL 的 AQE 可动态合并小分区、转换广播 Join 和处理倾斜分区。repartition 会 Shuffle，coalesce 减少分区时通常可避免全量 Shuffle，但可能形成不均衡。`,
      followUp: [{ q: "reduceByKey 为什么优于 groupByKey？", a: "reduceByKey 能在 map 端先做局部合并，Shuffle 的数据量直接降一个量级；groupByKey 把全部 value 原样拉取过去再分组，没有任何预聚合；只有确实需要全量 value 的场景才用后者（或改用更合适的数据结构）。" }, { q: "AQE 能解决哪些 Shuffle 问题？", a: "三类：运行时合并过小的 Shuffle 分区、按实际统计把 sort-merge join 动态转广播 join、自动识别并拆分倾斜的 join 分区；它依赖 Stage 间的运行时统计，但救不了单个超级热点键，也替代不了你选错的分区键。" }], tags: ["Spark Shuffle", "宽依赖", "AQE"]
    },
    {
      id: "CMP-008", category: "大数据组件原理", question: "HBase 的架构和一次读写流程是什么？", frequency: 4,
      answer: `①HMaster 管理表和 Region 分配，RegionServer 服务读写，ZooKeeper 协调；表按 RowKey 切成 Region。②写入先 WAL 再 MemStore，达到阈值 Flush 成 HFile，后台 Compaction 合并。③读取查 BlockCache、MemStore 和 HFile，借助 BloomFilter、索引及版本合并减少扫描。`,
      detail: `HDFS 提供底层持久化和副本，WAL 保障 RegionServer 故障后的重放。LSM 结构把随机写转为顺序追加，代价是读放大和 Compaction。RowKey 设计决定访问路径与负载分布，热点前缀会让单个 Region 过载。`,
      followUp: [{ q: "HBase 为什么写快？", a: "LSM 结构把随机写变成顺序追加：先写 WAL（顺序 IO 保证持久性），再写内存 MemStore 即返回，落盘交给后台 Flush 与 Compaction；代价是读放大和写放大被转移到了查询与后台——答出这个取舍才完整。" }, { q: "如何避免 RowKey 热点？", a: "打散单调前缀：时间戳、自增 ID 放 RowKey 开头会让写入永远挤在尾部 Region；常用散列前缀（md5 截断）、反转或 salt 分桶；同时要兼顾常用查询的前缀扫描能力，在热点与可扫性之间取平衡。" }], tags: ["HBase", "Region", "WAL", "LSM"]
    },
    {
      id: "CMP-009", category: "大数据组件原理", question: "DolphinScheduler、Azkaban、Airflow 有什么区别？", frequency: 4,
      answer: `①三者都做 DAG 调度、依赖、重试和告警。DolphinScheduler 面向大数据多租户，提供可视化编排、Worker 分组和较丰富任务插件。②Azkaban 部署简单、以 Flow 为核心，适合较传统 Hadoop 批任务。③Airflow 用 Python 定义 DAG，扩展生态强、工程灵活，但动态 DAG 与调度器治理要求更高。选型看团队和生态。`,
      detail: `不要只比较 UI，应关注高可用、补数、参数传递、资源隔离、权限审计、跨周期依赖和大规模 DAG 解析能力。调度系统负责任务编排，不替代 YARN/Kubernetes 等计算资源调度器。`,
      followUp: [{ q: "调度系统和资源调度系统有何区别？", a: "层次不同：任务调度（DolphinScheduler、Azkaban、Airflow）管 DAG 依赖、时间与数据触发、重试补数，回答“什么时候跑、按什么顺序跑”；资源调度（YARN、K8s）管 CPU 内存的分配与隔离，回答“跑在哪、给多少资源”；前者把任务提交给后者执行。" }, { q: "Airflow 的 DAG 为什么不建议在运行时动态变化？", a: "调度器周期性重新解析 DAG 文件：运行时动态增删任务会让历史运行实例与当前定义错位，重跑和补数语义混乱、Web 展示错乱；动态需求应使用动态任务映射等声明式特性，而不是在代码里写运行期分支。" }], tags: ["DolphinScheduler", "Azkaban", "Airflow"]
    },
    {
      id: "CMP-010", category: "大数据组件原理", question: "调度系统如何设计依赖、重跑和补数，避免重复或漏算？", frequency: 4,
      answer: `①任务以业务日期参数化，声明数据依赖而非只按固定时钟触发；上游实例成功且数据就绪后再运行。②每个实例幂等写临时分区并原子提交，失败从安全点重跑。③补数按日期生成独立实例，遵循依赖拓扑限流回放，并记录版本、影响范围和审计；跨周期依赖要显式表达。`,
      detail: `“任务成功”不等于“数据可用”，可在依赖后增加产出行数、分区完成标记和质量门禁。补数不能直接把当前维表关联历史事实，要使用历史版本或快照。大量补数需与日常 SLA 队列隔离。`,
      followUp: [{ q: "任务成功但产出为空怎么办？", a: "把任务状态与数据状态解耦：依赖判断不能只看“任务成功”，要加数据就绪信号——分区完成标志、行数下限、质量规则；产出为空先区分“源端本来没数”（合法空窗）和“链路漏数”（故障），再决定阻塞下游还是放行。" }, { q: "补数如何不影响当天正常任务？", a: "资源与节奏隔离：补数走独立队列或低优先级资源组，按依赖拓扑限流回放，避开业务高峰窗口；大补数前评估对存储和源库的压力并知会相关方——很多补数事故不是算错，是把当天正常任务挤死了。" }], tags: ["任务调度", "补数", "幂等", "依赖"]
    },

    {
      id: "RT-001", category: "实时数仓", question: "Lambda 和 Kappa 架构有什么区别？如何选择？", frequency: 5,
      answer: `①Lambda 同时维护离线批处理和实时速度层，再由服务层合并，历史重算能力强但两套代码易产生口径不一致。②Kappa 以不可变日志为统一来源，用同一流处理链路实时计算，历史重算通过回放日志，架构更简洁。③数据量巨大、复杂离线算法多时 Lambda 更稳；流批一体和日志可长期回放时优先 Kappa。`,
      detail: `Kappa 不是没有批处理，而是把批看成有界流。真正选择要看 Kafka 保留期、回放速度、状态规模、修正频率和团队能力。很多企业实践是核心明细统一、实时指标走流，复杂历史回刷仍用批引擎的混合架构。`,
      followUp: [{ q: "Kappa 如何修复一个月前的错误口径？", a: "靠日志回放：修好代码后从一个月前的 offset 重放 Kafka，用新结果覆盖旧的；前提是日志保留期够长、回放吞吐可行、状态可重建；保留期不够就得退回批快照补数——这正是现实中混合架构大量存在的原因。" }, { q: "流批一体是否等于 Kappa？", a: "不等于：流批一体是引擎能力（同一套 API 或 SQL 处理有界与无界数据），Kappa 是架构范式（单一不可变日志源加一条流链路承载全部计算）；完全可以用流批一体引擎去落地 Lambda——两个概念不在同一层。" }], tags: ["Lambda", "Kappa", "流批一体"]
    },
    {
      id: "RT-002", category: "实时数仓", question: "Flink 中事件时间、处理时间和 Watermark 分别是什么？", frequency: 5,
      answer: `①事件时间是事件实际发生时刻，能在乱序下得到业务正确结果；处理时间是算子看到事件的机器时间，延迟低但结果受运行波动影响。②Watermark 是对事件时间进度的估计，表示通常不再期待早于该时间的数据，用于触发窗口。③延迟容忍越大结果越完整但出数越慢，需结合乱序分布设置。`,
      detail: `Watermark 不是一条真实业务事件，也不会自动丢弃迟到数据；是否接纳由 allowed lateness、侧输出和自定义逻辑决定。多分区时算子 Watermark 取上游最小值，空闲分区会拖住进度，需配置 idleness。`,
      followUp: [{ q: "Watermark 为什么取上游最小值？", a: "Watermark 的语义是“早于该时间的数据通常都已到达”，只有取所有上游分区的最小值这个保证才成立——任何一个慢分区没到的数据都意味着整体还没到；由此自然引出空闲分区拖进度的问题和 withIdleness 配置。" }, { q: "迟到数据有哪些处理方式？", a: "四件套按口径选：allowedLateness 内更新窗口结果（输出修正）、侧输出流收集另行处理、超容忍直接丢弃（必须监控丢弃量）、业务层离线校准兜底；核心判断是下游能否接受结果修正。" }], tags: ["Flink", "Watermark", "事件时间"]
    },
    {
      id: "RT-003", category: "实时数仓", question: "Flink 的 Keyed State 和 Operator State 有什么区别？", frequency: 5,
      answer: `①Keyed State 仅用于 keyed stream，状态按 key 隔离并随 key-group 重分配，适合聚合、去重和定时器。②Operator State 绑定并行算子实例，重分区时按列表或广播规则重新分配，常用于 Source 分区位点。③状态由 StateBackend 管理并通过 Checkpoint 持久化，应配置 TTL 控制无限增长。`,
      detail: `Keyed State 逻辑上每个 key 独立，物理上按 key-group 分配到并行子任务，因此修改并行度仍能恢复。Broadcast State 是 Operator State 的特殊形式，让规则流广播到所有并行实例。TTL 是清理策略，不应代替业务正确的过期语义。`,
      followUp: [{ q: "修改并行度后 Keyed State 如何迁移？", a: "靠 key-group 重分配：key 先哈希到固定数量的 key-group，key-group 再分配到并行子任务；改并行度只是 key-group 的重新映射，状态后端按新分配恢复——这就是 Keyed State 支持弹性扩缩容的机制。" }, { q: "状态 TTL 到期是否立即删除？", a: "不一定：默认惰性清理，下次访问该状态时发现过期才删；后台主动清理取决于状态后端（如 RocksDB 靠 compaction filter 配置）；别把 TTL 当精确过期器，业务上的硬过期要自己用 Timer 或逻辑判断。" }], tags: ["Flink State", "Keyed State", "StateBackend"]
    },
    {
      id: "RT-004", category: "实时数仓", question: "Flink Checkpoint 的原理是什么？和 Savepoint 有何区别？", frequency: 5,
      answer: `①JobManager 向 Source 注入 Barrier，Barrier 随数据流传播；算子在收到各输入 Barrier 后对状态和位点做一致性快照，Sink 同步提交。②对齐模式会暂存快通道数据，无对齐模式把在途数据一并快照以降低反压延迟。③Checkpoint 自动容错且可清理，Savepoint 由用户触发、长期保留，用于升级迁移。`,
      detail: `Checkpoint 基于 Chandy-Lamport 思想。状态通常增量上传到持久存储，完成后 JobManager 记录成功元数据。若 Barrier 长时间对齐，常说明反压或输入不均衡。升级从 Savepoint 恢复需保持算子 uid 稳定以映射状态。`,
      followUp: [{ q: "Barrier 会不会阻塞所有数据？", a: "对齐模式下只阻塞“跑得快的那条输入通道”：先到 Barrier 的通道暂停消费并缓冲，各通道到齐后做快照再放行；反压大时对齐时间会拉长，于是有了非对齐 Checkpoint——把在途数据一并快照，换更小的停顿。" }, { q: "为什么升级任务要显式设置 uid？", a: "状态恢复按算子 uid 映射：不显式设置时 uid 由拓扑结构自动生成，改动 DAG（哪怕只是挪动算子位置）就会变化，Savepoint 里的状态便对不上新作业；显式 uid 让状态在版本升级间可迁移。" }], tags: ["Checkpoint", "Savepoint", "Barrier"]
    },
    {
      id: "RT-005", category: "实时数仓", question: "Flink 如何实现端到端 Exactly-Once？", frequency: 5,
      answer: `①Source 必须能按 Checkpoint 恢复精确读取位点，算子状态与位点进入同一一致性快照。②失败后从最近成功 Checkpoint 重放，内部状态不会重复生效。③Sink 需支持两阶段提交事务，随 Checkpoint 预提交并在全局成功后提交；或以稳定业务键幂等 Upsert。任何一环不支持，端到端只能至少一次。`,
      detail: `Kafka Source 位点随 Checkpoint 保存，不依赖自动提交。Kafka Sink 可使用事务；数据库 Sink 可用 XA、两阶段提交或幂等键。Checkpoint 成功前外部系统若已可见写入，失败重放就会重复，因此 Sink 语义是关键。`,
      followUp: [{ q: "两阶段提交会遇到事务超时吗？", a: "会，这是实践大坑：预提交事务挂得太久会被下游中止（Kafka 事务超时、数据库锁超时），提交阶段随即失败；要按 Checkpoint 间隔调大事务超时、监控悬挂事务，并理解失败后是走 Checkpoint 恢复重放的。" }, { q: "幂等写与事务写各有什么代价？", a: "幂等写简单低耦合，但要求稳定业务键，且读侧可能短暂看到中间态（适合状态型表、不适合事件流）；事务写读隔离好（read_committed 才可见），代价是协调开销、事务超时和系统支持门槛——按下游消费形态选。" }], tags: ["Exactly-Once", "两阶段提交", "幂等"]
    },
    {
      id: "RT-006", category: "实时数仓", question: "Kafka 为什么吞吐量高？", frequency: 5,
      answer: `①分区让读写可横向并行，消息按分区追加，避免随机写。②Producer 批量聚合并压缩消息，Broker 利用顺序磁盘 IO、页缓存和零拷贝降低系统调用与复制成本。③Consumer Pull 模式按偏移批量拉取，多个消费组独立读取。高吞吐来自端到端批处理与顺序访问，不代表单条延迟永远最低。`,
      detail: `现代磁盘顺序写配合 OS Page Cache 吞吐很高。sendfile 等零拷贝减少用户态与内核态拷贝。batch.size、linger.ms、compression.type 能提升吞吐但会增加等待或 CPU，需按时延目标权衡。`,
      followUp: [{ q: "分区数越多吞吐一定越高吗？", a: "不是：分区提高并行度上限，但每个分区都消耗文件句柄、内存与副本开销，分区越多 Broker 故障恢复越慢，端到端延迟可能上升；消费端并行度还封顶于分区数——按吞吐目标、key 基数与运维成本权衡，而非越大越好。" }, { q: "零拷贝减少了哪些拷贝？", a: "传统路径是磁盘到内核缓冲到用户态缓冲到 socket 缓冲到网卡，四次拷贝加两次上下文切换；sendfile 让数据在内核空间直接流转，省掉内核与用户态之间的来回拷贝，CPU 与内存带宽都省下来。" }], tags: ["Kafka", "高吞吐", "顺序写", "零拷贝"]
    },
    {
      id: "RT-007", category: "实时数仓", question: "Kafka 如何保证消息可靠且有序？", frequency: 5,
      answer: `①分区副本由 Leader 处理读写，Follower 复制；acks=all 要求 ISR 中副本确认，结合 min.insync.replicas 防止副本不足时冒险写入。②Producer 开启幂等可避免重试重复，事务可跨分区原子写。③Kafka 只保证单分区内顺序，全局有序需单分区；消费端位点提交要与处理结果一致。`,
      detail: `unclean leader election 若允许非 ISR 副本当 Leader，可能丢失已确认消息。业务 key 决定分区，可保证同一订单有序。Consumer 先提交 offset 再处理会丢，处理后提交会重复，通常配合幂等或事务消费处理。`,
      followUp: [{ q: "ISR 是什么？", a: "与 Leader 保持同步的副本集合，落后太多会被踢出：acks=all 只等待 ISR 确认，min.insync.replicas 设确认下限；Leader 宕机从 ISR 中选新主才不会丢已确认消息——配合关闭 unclean leader election 才构成完整可靠性语义。" }, { q: "Kafka 为什么无法低成本保证全局有序？", a: "全局有序等于全局单点：跨分区排序需要所有分区互相同意顺序，要么退回单分区（并行度与吞吐归零），要么消费端做全量排序缓冲；Kafka 的取舍就是“分区内有序加按 key 路由”，把顺序需求约束在业务键粒度。" }], tags: ["Kafka 可靠性", "ISR", "幂等 Producer"]
    },
    {
      id: "RT-008", category: "实时数仓", question: "ClickHouse、Doris、StarRocks 如何对比选型？", frequency: 5,
      answer: `①ClickHouse 单表扫描聚合极强、生态成熟，适合日志明细和高吞吐 OLAP，但分布式 Join 与高频更新治理要求较高。②Doris、StarRocks 都强调 MPP、向量化、MySQL 协议和实时分析，主键模型、更新与多表 Join 更友好。③选型应实测数据模型、并发、更新、Join、导入、运维及成本，不能只看跑分。`,
      detail: `三者版本演进快，功能边界不断变化。ClickHouse MergeTree 通过后台合并组织数据；Doris/StarRocks 有 Duplicate、Aggregate、Unique/Primary Key 等模型。StarRocks 强调 CBO 与湖仓查询，Doris 在易用和一体化分析方面活跃，最终以当前版本 PoC 为准。`,
      followUp: [{ q: "主键模型如何支持更新？", a: "写入仍是追加新版本：Doris Unique、StarRocks Primary Key 在 compaction 或查询合并时按主键保留最新版本，StarRocks 还维护主键索引加速定位；本质是“读时/合并时去重”换写入简单，和 Hive 拉链是两种取舍。" }, { q: "为什么 ClickHouse 不适合直接替代所有数仓层？", a: "它的强项是单表大扫描聚合，弱项同样鲜明：多表关联要手工做数据布局、更新删除是异步 mutation 而非实时、事务和约束基本没有；数仓的明细建模、维度关联与口径治理，不能指望一个 OLAP 引擎全部包办。" }], tags: ["ClickHouse", "Doris", "StarRocks", "OLAP"]
    },
    {
      id: "RT-009", category: "实时数仓", question: "实时数仓如何分层并保证离线、实时口径一致？", frequency: 5,
      answer: `①实时链路也可划 ODS、DWD、DWS/ADS，但层级宜轻，Kafka Topic 或湖仓表承载标准事件与公共明细。②统一事件模型、维度、指标定义和业务时间语义，流批复用 SQL/代码或由同一指标配置生成。③通过同时间窗双算对账、迟到修正和最终离线校准，避免两套逻辑长期漂移。`,
      detail: `实时 ODS 保留 CDC/日志原貌，实时 DWD 清洗成业务事件，DWS 做窗口聚合，结果写 OLAP 服务。每层都落 Kafka 会增加延迟与运维，应只对复用、回放或隔离有价值的节点物化。`,
      followUp: [{ q: "实时链路每层都要落 Kafka 吗？", a: "不必：物化要付出延迟、存储和运维成本，只在有复用、回放或隔离价值的节点落 Topic 或表（典型是 DWD 公共明细）；纯串联的清洗在一个作业内完成即可——分层是逻辑契约，不等于每层都是物理 Kafka Topic。" }, { q: "离线结果覆盖实时结果会不会回退？", a: "会，这是 Lambda 合并层经典坑：实时结果里含有离线尚未处理的最新增量，被离线整表覆盖就倒退；解法是分时段拼接（离线负责 T-1 及以前、实时负责今天），或覆盖时保留实时侧的水位标记。" }], tags: ["实时数仓", "流批一致", "分层"]
    },
    {
      id: "RT-010", category: "实时数仓", question: "实时事实如何关联不断变化的维度？", frequency: 4,
      answer: `①维度小且变化少可广播到 Flink State，由 CDC 更新；查询外部存储可用异步 IO、缓存和限流降低延迟。②要按当前属性分析可查最新维度，要按事件当时属性分析则需 Temporal Join，根据事件时间匹配维度版本。③必须处理维度迟到、缓存过期、乱序和关联失败，并监控未知键比例。`,
      detail: `广播状态吞吐高但每个并行实例保存全量，不适合超大维度。异步查询需控制超时、容量和顺序语义。Flink SQL Temporal Table Join 可结合版本表按时间查询，前提是变更日志与主键语义正确。`,
      followUp: [{ q: "广播维度状态过大怎么办？", a: "广播意味着每个并行实例持有一份全量：放不下就换异步 IO 查外部存储（Redis、HBase、OLAP 库）加 LRU 缓存，或把维度裁剪到需要的列与活跃子集； keyed 查询场景还可提高并行度摊薄每实例的 key 量。" }, { q: "缓存命中但维度已更新如何保证正确？", a: "先定口径：按“当前属性”分析，就缩短 TTL 或用 CDC 主动失效缓存；按“事件当时属性”分析，缓存方案根本不满足，必须上 Temporal Join 匹配维度版本——缓存新鲜度策略要写进数据契约。" }], tags: ["实时维度", "Temporal Join", "异步 IO"]
    },

    {
      id: "GOV-001", category: "数据质量与治理", question: "数据质量六大维度是什么？如何理解？", frequency: 5,
      answer: `①完整性看必需数据是否缺失；准确性看数据是否反映真实业务；一致性看跨表跨系统口径是否相符。②唯一性看主键或业务实体是否重复；及时性看是否在 SLA 内产出；有效性看格式、类型、范围和枚举是否合法。③六维度需转为可量化规则、阈值、负责人和处置流程。`,
      detail: `不同体系可能把规范性、可用性单列，面试应说明采用的定义。质量不是单一分数：同一字段可能格式有效但业务不准确。规则应绑定数据资产与业务影响等级，核心指标使用更严格阈值和阻断策略。`,
      followUp: [{ q: "准确性如何自动监控？", a: "准确性最难自动化，因为它衡量的是“数据与真实业务的符合度”：可行手段是与权威源对账（金额、状态逐层比对）、业务规则校验（年龄在合理区间、支付时间不早于下单时间）、跨表逻辑一致性、分布突变的异常检测；承认“权威锚点加规则集，没有全自动银弹”是加分回答。" }, { q: "完整性和有效性有什么区别？", a: "一句话：完整性回答“有没有”，有效性回答“合不合法”。必填字段为空、记录丢失是完整性；格式、类型、范围、枚举值不合法是有效性；举例：手机号缺失是完整性问题，手机号填成 12 位是有效性问题。" }], tags: ["数据质量", "完整性", "准确性", "一致性"]
    },
    {
      id: "GOV-002", category: "数据质量与治理", question: "如何搭建数据质量监控体系？", frequency: 5,
      answer: `①事前在模型和指标定义阶段配置主键、非空、枚举、范围及 SLA 规则；事中监控任务、行数波动、分布、重复率和跨层对账。②规则按数据等级设静态阈值、同比环比或异常检测，失败可告警、阻断发布或降级。③事后要有负责人、影响分析、修复回刷、复盘和规则沉淀，形成闭环。`,
      detail: `规则结果需保存检测批次、样本和血缘，避免只发一条无上下文告警。告警要聚合降噪并分级路由。模型升级时质量基线可能合法变化，应走变更审批而不是简单放宽阈值。核心链路可设置质量分和发布门禁，但规则平台自身也要监控执行成功率与覆盖率。`,
      followUp: [{ q: "行数波动阈值如何设置？", a: "别拍脑袋定静态值：按该表历史波动分布设基线（同比环比分位数、3σ），业务量增长期用动态基线；阈值还要联动业务日历（大促、月末天然波动）；大表看绝对差、小表看比例，分级告警。" }, { q: "什么质量问题应该阻断下游？", a: "会影响决策正确性且不可逆的才阻断：主键重复、核心金额口径错误、大范围 null、跨层对账超阈值；格式类、非核心字段问题降级为告警放行；原则一句话——错数宁可不出数，脏数可以后补。" }], tags: ["质量监控", "SLA", "告警", "闭环"]
    },
    {
      id: "GOV-003", category: "数据质量与治理", question: "什么是元数据管理？技术、业务和操作元数据各包括什么？", frequency: 4,
      answer: `①技术元数据描述表、字段、类型、分区、任务、存储和血缘；业务元数据描述术语、口径、负责人、数据域和安全等级；操作元数据记录调度状态、产出时间、行数、访问热度与成本。②统一采集、关联和检索这些信息，可支撑找数、影响分析、质量、安全、生命周期和成本治理。`,
      detail: `元数据平台不能只做目录展示，应接入建表、调度、查询日志、BI 和质量系统，形成自动采集。人工维护的业务口径要有审批和版本。实体间用全局标识关联，才能从一个指标追到字段、任务和源系统。`,
      followUp: [{ q: "元数据如何自动采集？", a: "对接各系统的接口与日志：Metastore 和 DDL 抓技术元数据，调度系统 API 抓任务与运行状态，查询日志抓访问热度，SQL 解析抓血缘，质量平台抓规则结果；只有业务口径这类人工元数据靠登记加审批——目标是“能不让人填的都不让人填”。" }, { q: "数据目录和元数据平台有什么区别？", a: "目录是平台的一种应用形态：面向找数场景，提供资产清单、搜索和负责人信息；元数据平台还包括血缘、影响分析、质量、安全、生命周期等治理能力；目录是门面，平台是底座。" }], tags: ["元数据", "数据目录", "操作元数据"]
    },
    {
      id: "GOV-004", category: "数据质量与治理", question: "数据血缘如何解析？它能解决哪些问题？", frequency: 5,
      answer: `①血缘描述数据从源到表、字段、指标和报表的加工依赖。可从 SQL AST 解析静态字段映射，结合调度依赖、运行日志和 API 配置补全动态链路。②表级血缘易建设，字段级需处理别名、表达式、UDF 和动态 SQL。③血缘用于影响分析、根因定位、口径追溯、安全传播和下线评估。`,
      detail: `仅解析 FROM 表只能得到表级依赖，不能解释目标字段来自哪个表达式。动态拼接 SQL 可在执行后采集实际 SQL 再解析。血缘必须带版本和时间，否则模型变更后看到的当前图无法解释历史产出。`,
      followUp: [{ q: "UDF 内部血缘怎么处理？", a: "SQL 解析在 UDF 处天然断链：策略是 UDF 注册时人工标注输入输出映射（白盒登记）、对内置标准函数实现解析规则，最差情况保守标记为“依赖全部输入字段”；承认 UDF 和黑盒存储过程是字段级血缘的盲区比假装能解析更专业。" }, { q: "调度依赖能否直接当数据血缘？", a: "不能等同：调度依赖是任务编排关系，可能含无数据交换的控制依赖，也会漏掉同一任务内的多表读写；数据血缘是表和字段的实际加工映射；两者互补校验——血缘缺边查调度，调度冗余边查血缘。" }], tags: ["数据血缘", "SQL AST", "影响分析"]
    },
    {
      id: "GOV-005", category: "数据质量与治理", question: "数仓中的数据安全和脱敏怎么做？", frequency: 5,
      answer: `①先按敏感性和影响分级分类，遵循最小权限、按角色或属性授权，并对行、列、租户做隔离。②存储和传输加密，手机号、证件等采用掩码、哈希、令牌化或加密，按可逆需求选择。③生产、测试环境隔离，导出和高危查询审批，访问全量审计；脱敏规则应沿血缘向下游传播。`,
      detail: `哈希适合等值匹配但要加盐防彩虹表；加密可逆，需严格密钥管理；Tokenization 通过映射服务减少明文暴露。动态脱敏按访问者返回不同结果，静态脱敏生成不可逆副本。聚合数据也可能被小样本反推，需设最小群体阈值。`,
      followUp: [{ q: "哈希和加密如何选择？", a: "按可逆需求选：只需等值匹配（关联、去重）用加盐哈希，不可逆更安全；需要还原明文（外发、客服）用加密并配严格密钥管理；要跨系统一致可逆又不想扩散密钥，用令牌化映射服务；哈希一定记得加盐防彩虹表。" }, { q: "如何防止聚合结果反推个人？", a: "防小样本反推：群体计数设最小阈值（如小于 10 不展示）、抑制可交叉钻取的维度组合、敏感报表做泛化（年龄段化）或加噪；差分隐私是系统化方案，工程底线是“阈值加维度抑制”。" }], tags: ["数据安全", "脱敏", "最小权限", "审计"]
    },
    {
      id: "GOV-006", category: "数据质量与治理", question: "数据生命周期管理包括哪些环节？", frequency: 4,
      answer: `①从数据创建、热用、归档到删除制定分层保存策略，依据法规、业务追溯、重算窗口和访问热度确定保留期。②热数据放高性能存储，温冷数据降存储等级或压缩归档，过期数据经审批可验证删除。③生命周期策略写入表元数据并自动执行，同时考虑副本、备份、下游派生和法律保留要求。`,
      detail: `不能只删主表而忽略备份、缓存和导出副本。删除前通过血缘确认依赖，归档后保留可检索目录和恢复流程。分区表优先按时间分区过期，避免逐行删除；重要快照可降冷而非永久放在高性能集群。`,
      followUp: [{ q: "ODS、DWD、ADS 保留周期应一样吗？", a: "不一样，按重放价值定：ODS 是重放源头，保留最长或按法规要求；DWD 保留覆盖回刷窗口即可；ADS 与报表生命周期绑定，可以最短；一句话——越靠上游越像档案，越靠下游越像缓存。" }, { q: "用户要求删除个人数据如何沿链路执行？", a: "靠血缘加主数据：用 OneID 定位该用户全部记录，沿血缘梳理主表、派生表、备份、缓存和导出文件，分别执行删除或匿名化并留存执行凭证；拉链和历史版本要特殊处理（匿名化或闭链，而不是简单删行导致区间错乱）。" }], tags: ["生命周期", "归档", "数据删除"]
    },
    {
      id: "GOV-007", category: "数据质量与治理", question: "如何做大数据平台的成本治理？", frequency: 4,
      answer: `①先建立表、任务、查询到团队和业务的成本归属，采集 CPU、内存、Shuffle、存储、副本和扫描量。②识别低使用表、重复模型、长期小文件、全表扫描、资源空转和超配任务，分别做下线、合并、分区、压缩和弹性调度。③以单位数据或指标成本衡量收益，设置预算、配额和持续看板，不能只靠压资源。`,
      detail: `成本优化要守住 SLA 和正确性。热点数据可缓存或预聚合，冷数据降存储等级，补数与日常任务分队列。通过查询日志统计表的最后访问、消费者和扫描列，结合血缘安全下线，不可凭“近七天没人查”直接删除。`,
      followUp: [{ q: "如何判断一张表可以下线？", a: "用证据链而非感觉：查询日志看最后访问时间与消费者、血缘看下游依赖、扫描列看使用深度；零依赖加长未访问的先置“候选下线”公示并设只读观察期，再归档删除；还有消费者的先迁移后下线。" }, { q: "Spot 资源适合运行哪些任务？", a: "可中断、可重试、无硬 SLA 的任务：补数回刷、探索性分析、离线测试、错峰批量；核心 SLA 链路和长状态实时任务不适合（抢占中断代价高）；配套自动重试和降级到按量资源的策略。" }], tags: ["成本治理", "FinOps", "资源优化"]
    },
    {
      id: "GOV-008", category: "数据质量与治理", question: "源系统与数仓金额不一致，应该建立怎样的对账机制？", frequency: 5,
      answer: `①按相同业务边界建立分层对账：源端、ODS、DWD、汇总层分别比较行数、主键数、金额及状态分布，并保留批次水位。②大表可用分区聚合、分桶哈希和抽样定位，差异下钻到业务键。③明确取消、退款、时区、迟到和精度口径，超阈值阻断发布；修复后重跑受影响链路并留审计。`,
      detail: `总金额相等不代表数据正确，可能正负差异抵消；需同时比主键集合、分布和关键字段哈希。对账应在同一快照点进行，否则在线源库持续变化会造成假差异。财务类可引入借贷或结算凭证作为权威锚点。`,
      followUp: [{ q: "大表逐行对账成本太高怎么办？", a: "分桶哈希加分层下钻：按分区或主键分桶，每桶聚合行数、金额和、哈希和，桶级一致直接跳过，不一致的桶再下钻明细；配合抽样，把全量逐行比对成本降几个数量级。" }, { q: "源库持续更新时怎样取同一快照？", a: "在线库没有静态快照：用基于事务的一致性导出，或记录起止水位（时间戳、binlog 位点），只比对“水位时刻”的状态，期间变化归入下一批次；财务场景以结算凭证快照为权威锚点。" }], tags: ["数据对账", "金额", "分桶哈希"]
    },

    {
      id: "MET-001", category: "指标体系", question: "原子指标、派生指标和衍生指标分别是什么？", frequency: 5,
      answer: `①原子指标是某业务过程下不可再拆的度量，如支付金额、支付买家数，绑定明确事实和聚合方式。②派生指标由原子指标加统计周期、业务限定和分析维度组成，如近 7 日华东新客支付金额。③衍生指标由一个或多个指标计算得到，如支付转化率、客单价；应保存分子分母并明确单位。`,
      detail: `不同公司术语可能把复合指标也称衍生指标，回答时先给定义。派生指标公式可表示为原子指标 + 时间周期 + 修饰词 + 维度。指标系统应复用这些结构化元素，而不是给每个报表字段写一段独立 SQL。`,
      followUp: [{ q: "支付人数是原子指标还是派生指标？", a: "原子指标：它绑定“支付”业务过程，度量是买家去重计数、聚合方式明确，且不带统计周期和修饰限定；加上“近 7 日”“华东”才变成派生指标——判断点就盯那三件修饰（周期、限定、维度）有没有加。" }, { q: "同比、环比属于哪类指标？", a: "衍生指标：由同一派生指标在两个时间窗口上的值计算而来（本期与上期之比）；它不产生新度量，只是已有指标加时间比较逻辑，管理上要复用基指标的定义而不是单独写 SQL。" }], tags: ["原子指标", "派生指标", "衍生指标"]
    },
    {
      id: "MET-002", category: "指标体系", question: "阿里 OneData 体系的核心思想是什么？", frequency: 5,
      answer: `①OneData 强调统一数据标准、统一模型、统一指标和统一服务，通过数据域、业务过程、总线矩阵及一致性维度减少重复建设。②OneModel 规范分层与公共模型，OneID 统一实体标识，OneMetric 统一指标定义。③目标是数据只加工一次、多场景复用，但落地依赖责任机制、元数据和研发流程，不能只靠命名规范。`,
      detail: `各企业对 OneData 子体系命名会有差异，核心都是“一致、复用、可治理”。落地可从高价值主题域做总线矩阵、公共维度和指标字典，再通过开发平台把标准转成校验规则，避免先做大而全平台。`,
      followUp: [{ q: "OneID 如何解决跨端用户识别？", a: "实体解析思路：用手机号、登录账号、设备 ID 等多源标识建映射图，边按证据强度分级（登录态强证据、设备指纹弱证据），图连通分量即同一实体；规则要可解释、可回溯，并配误差评估与人工仲裁出口。" }, { q: "OneData 为什么容易落地失败？", a: "常见死因是把它做成平台项目而非治理工程：没有明确的数据 Owner 和考核，标准停留在文档；老链路改造成本高、业务看不到收益；正确姿势是高价值域试点、把标准嵌进研发流程与平台校验，用复用收益换支持。" }], tags: ["OneData", "OneModel", "OneID", "OneMetric"]
    },
    {
      id: "MET-003", category: "指标体系", question: "如何保障不同报表中的指标口径一致？", frequency: 5,
      answer: `①指标必须有唯一编码，明确业务含义、公式、粒度、维度、时间、过滤、单位、数据源和负责人，并经过业务审批及版本管理。②公共原子事实和一致性维度统一产出，报表通过语义层或指标服务复用定义，禁止复制 SQL。③变更做影响分析、双跑对账和兼容发布，持续监控同名异义与异名同义。`,
      detail: `口径一致不等于所有场景只能有一个指标。例如“支付金额”可有下单口径、财务结算口径，但必须明确命名、适用边界和映射关系。指标平台要能从指标追溯到模型字段、任务和报表消费者。`,
      followUp: [{ q: "业务方坚持使用自己的口径怎么办？", a: "不强行统一，做显式多口径：先评审差异的业务合理性——合理就注册为不同指标（命名显式区分财务口径、业务口径）并声明映射关系；不合理就拿数据证明分歧成本推动收敛；真正要杜绝的是同名异义暗存。" }, { q: "指标变更如何保证历史可比？", a: "版本化加双跑：新旧口径并行计算一个观察期，发布差异说明和新旧值映射；历史是否回刷要写清（财务类通常回刷，运营类可只向前生效）；变更记录进指标字典，保证任何时点能解释当时口径。" }], tags: ["指标口径", "语义层", "版本管理"]
    },
    {
      id: "MET-004", category: "指标体系", question: "设计指标体系的一般步骤是什么？", frequency: 4,
      answer: `①从业务目标和价值链出发，划分主题域与业务过程，梳理核心对象、事件和分析场景。②定义原子指标、统计周期、修饰词、维度和衍生公式，建立指标树与命名编码。③映射到权威事实和维度模型，明确更新频率、质量规则、权限及负责人。④评审上线后统计使用率，持续合并重复和下线失效指标。`,
      detail: `不能从现有报表字段倒推后就结束，否则会复制历史混乱。指标树应说明结果指标和过程指标的驱动关系。建设优先覆盖核心决策场景，再扩展长尾，避免一次性定义几千个无人使用的指标。`,
      followUp: [{ q: "指标树和指标字典有什么区别？", a: "指标树讲结构关系：北极星到结果指标到过程指标的驱动分解，回答“指标之间什么关系”；指标字典是定义注册表，记录每个指标的口径、公式、负责人、版本，回答“每个指标是什么”；树管脉络，字典管定义。" }, { q: "如何治理长期无人使用的指标？", a: "先度量再处置：用平台访问统计找出零使用指标，公示后降级——停每日产出、保留定义按需计算，而不是直接删除；同时复盘入口：新指标立项必须回答“谁在什么决策里用它”，从源头控制膨胀。" }], tags: ["指标体系", "指标树", "业务过程"]
    },
    {
      id: "MET-005", category: "指标体系", question: "什么是北极星指标？如何为业务选择？", frequency: 4,
      answer: `①北极星指标是在一定阶段最能代表用户获得核心价值、并能驱动长期业务增长的单一核心度量。②选择时要求与用户价值强相关、可持续、可行动、可拆解且不易被短期操纵，如电商不宜只看 GMV。③需配套护栏指标监控利润、质量和风险，并随业务阶段审视，而非永久不变。`,
      detail: `内容产品可关注有效消费时长而非纯点击，SaaS 可关注活跃付费账户的核心功能使用。北极星指标需拆成获客、激活、留存等驱动指标，团队才能行动；护栏指标防止为提升主指标牺牲退款率或体验。`,
      followUp: [{ q: "GMV 为什么可能不是好的北极星指标？", a: "它可被短期手段操纵且与用户价值脱钩：补贴能冲 GMV 但牺牲利润和复购，退货也被掩盖；好的北极星要反映用户获得的核心价值（成交买家数、有效消费时长）；GMV 更适合当结果指标或护栏指标的一员。" }, { q: "北极星指标可以有多个吗？", a: "原则上一个：北极星的价值就在聚焦和取舍，多个等于没有；多元化业务（双边市场、多产品线）可按业务单元各设一个，但同一团队同一阶段只能有一个，其余全部归入护栏指标。" }], tags: ["北极星指标", "用户价值", "护栏指标"]
    },
    {
      id: "MET-006", category: "指标体系", question: "指标中的统计周期、业务日期和数据时间应该如何定义？", frequency: 4,
      answer: `①统计周期说明自然日、滚动 7 日、月累计等窗口及开闭区间；业务日期按业务发生语义归属，处理时间只表示数据何时到达。②必须统一时区、跨日边界和迟到截止时间，明确当天数据是实时暂估还是最终值。③累计、同比、环比需指定可比日历，节假日或财务月不能默认按简单日期偏移。`,
      detail: `例如海外交易统一存 UTC，但报表按门店时区归属自然日；同一订单可能在 UTC 与北京时间落入不同日期。T+1 最终口径要声明封板时间，迟到数据是回补历史还是计入到达日会直接影响趋势。`,
      followUp: [{ q: "滚动 7 日和自然周有什么差异？", a: "窗口对齐方式不同：滚动 7 日以当天为终点向前滑，每天口径一致但跨周混合；自然周按周一到周日对齐，未完结的周不能直接和上周比；两者的同比对象和解读方式都要相应调整，混用是周报常见错误。" }, { q: "多时区业务如何分区？", a: "存储与归属分离：底层统一存 UTC 时间戳，业务归属按经营口径（如门店当地自然日）在 ETL 中转换出业务日期再分区；别把服务器时区当业务时区，跨日订单的归属规则必须写进指标定义。" }], tags: ["统计周期", "业务日期", "时区"]
    },
    {
      id: "MET-007", category: "指标体系", question: "指标平台或语义层应该提供哪些核心能力？", frequency: 4,
      answer: `①以结构化方式管理指标、维度、口径、版本、负责人和权限，并绑定底层模型及字段血缘。②根据查询请求统一生成 SQL，支持维度下钻、时间窗口、缓存、预聚合和多引擎路由。③提供审批、影响分析、质量监控、API/BI 服务和使用度量。平台应约束公共口径，同时允许受治理的场景化扩展。`,
      detail: `语义层把“指标定义”与“具体报表 SQL”分离，同一指标可被 BI、API 和应用复用。难点是不同事实粒度 Join、非可加指标、权限下推与查询成本。平台不能掩盖底层模型问题，仍需可靠事实和一致维度。`,
      followUp: [{ q: "语义层如何处理不同粒度事实？", a: "禁止裸连：语义层应感知各事实表的粒度声明，查询涉及多事实时先各自按请求维度聚合、再按共同维度合并（drill-across）；底层模型做不到的，要在建模层补公共汇总，而不是生成会放大指标的 join SQL。" }, { q: "预聚合命中失败时怎么办？", a: "透明回退：路由层判断预聚合表是否覆盖查询的维度与指标，不覆盖就回落明细现算，并记录未命中原因反哺预聚合设计；对用户只暴露“慢”，绝不暴露“错”——预聚合是加速层，不是语义层。" }], tags: ["指标平台", "语义层", "指标服务"]
    },

    {
      id: "PRJ-001", category: "项目与开放题", question: "面试中如何用 STAR 法则讲一个数仓项目？", frequency: 5,
      answer: `①S 交代业务背景、数据规模、原有痛点和约束；T 说明你负责的明确目标及量化指标。②A 是重点，按方案选型、模型设计、关键难点、取舍和协作讲自己的行动，不只罗列组件。③R 用时效、准确率、成本、复用率等结果量化，并补充复盘与后续优化。全程围绕一条主线，可接受追问。`,
      detail: `一个 3 分钟版本可按 20% 背景、10% 任务、55% 行动、15% 结果分配。避免说“我们用了 Hadoop 全家桶”，要说为什么这样选、你具体做了什么、如何验证。准备架构、模型、质量、性能和故障五类追问证据。`,
      followUp: [{ q: "项目中最难的问题是什么？", a: "选有决策含量的难：不是“数据量大”，而是权衡型难题（一致性与时效的取舍、历史口径迁移）；按难点、备选方案、你的判断、验证、结果来讲，落点是你个人的贡献而非团队成绩单。" }, { q: "如果重做一次你会改什么？", a: "这题考复盘能力：选一个真实但不致命的改进点（如更早引入数据契约、先建质量基线再动手），说明当时约束下选择的合理性和现在认知的变化——“诚实加成长”就是最佳结构，别自我否定也别假装完美。" }], tags: ["STAR", "项目表达", "量化结果"]
    },
    {
      id: "PRJ-002", category: "项目与开放题", question: "线上发现两个报表数据不一致，你会如何排查？", frequency: 5,
      answer: `①先冻结问题范围：指标、日期、维度、差异量、版本和查询时间，确认是否同口径、同权限、同刷新时点。②沿血缘从报表到 ADS、DWS、DWD、ODS 分层对账，按业务键下钻，检查重复关联、过滤、迟到、时区、精度和任务版本。③定位后止损、幂等修复并回刷，完成影响通知、复盘和质量规则补充。`,
      detail: `先找“最早出现差异的层”，能快速缩小范围。对总量差异做差集和分桶哈希；对部分维度差异检查维表版本与 Join 基数。不要一开始重跑所有任务，这可能覆盖证据且扩大影响。`,
      followUp: [{ q: "如果源系统数据也在变化怎么对账？", a: "取同一逻辑时点：记录源端水位（时间戳或 binlog 位点）与数仓批次水位，只比对水位一致的部分，期间变化归入下一批次；或用源端一致性快照导出；财务口径以结算凭证为权威锚点。" }, { q: "如何快速判断是重复还是漏数？", a: "先看方向再定性质：目标比源多，查重复（主键分组计数、join 放大、任务重跑）；目标比源少，查漏数（过滤条件、join 丢行、分区缺失、迟到未回补）；差集一拉，性质立判。" }], tags: ["数据不一致", "排障", "对账", "血缘"]
    },
    {
      id: "PRJ-003", category: "项目与开放题", question: "如何完成一次数仓模型重构和历史回刷？", frequency: 5,
      answer: `①先基于血缘、查询和质量数据识别痛点，明确新模型粒度、口径、兼容范围及收益，冻结变更方案。②新旧链路双跑，按日期、主键、金额和分布对账；历史回刷使用版本化代码、历史维度和隔离资源，按依赖拓扑分批执行。③消费者灰度切换并观察 SLA，保留回滚窗口，确认无依赖后再下线旧表。`,
      detail: `回刷最容易错在拿当前维度解释历史、代码与当时口径不一致、覆盖在线分区。应记录每批输入快照、代码版本和输出批次，先小日期验证再扩展。兼容视图可降低字段迁移成本，但应设明确下线日期。`,
      followUp: [{ q: "历史维度不完整时如何回刷？", a: "三个补救层次：有 ODS 或快照就从源头重建历史维度版本；只有当前维度时，历史事实按就近版本或未知键处理，并显式标注口径损失；关键报表无法接受的，和业务协商不回刷或只回刷可追溯区间——别硬刷出“看似正确”的假历史。" }, { q: "双跑结果有少量合法差异怎么判断？", a: "先定义合法差异白名单：时间戳精度、浮点舍入、迟到数据窗口、明确的口径修正点；逐条差异分类归因，落在白名单内且有量化解释的放行，其余必须清零才能切流。" }], tags: ["模型重构", "历史回刷", "双跑", "灰度"]
    },
    {
      id: "PRJ-004", category: "项目与开放题", question: "让你介绍一个实时数仓项目，你会讲哪些核心内容？", frequency: 5,
      answer: `①先讲业务时效目标、峰值吞吐、数据源和消费场景，再给出 CDC/日志→Kafka→Flink→OLAP 的主链路及分层。②重点说明事件模型、Watermark、状态、Checkpoint、幂等 Sink、维度关联和流批校准。③用端到端延迟、可用性、准确率、峰值容量和资源成本量化结果，并准备一次故障案例。`,
      detail: `架构图不是组件清单，要标出数据流、状态存储、容错边界和 SLA。面试官常追问“为什么不用离线”“重复与迟到怎么办”“维度更新怎么办”“峰值如何扩容”，回答要回到业务约束和观测数据。`,
      followUp: [{ q: "为什么选择 Flink 而不是 Spark Streaming？", a: "按真实约束讲三点：真正的逐事件处理与事件时间语义（Spark Streaming 是微批）、大状态管理（RocksDB 状态后端加 Checkpoint）、Exactly-Once 与窗口生态的成熟度；同时承认 Spark 在流批统一和生态上的优势，选型讲约束不讲信仰。" }, { q: "实时与离线不一致时以谁为准？", a: "分时段回答：最终一致性以离线 T+1 为准——它处理迟到、修正、去重最完整；实时结果是“准最终态”，服务时效场景；关键是两套共享同一口径定义，差异有监控和收敛机制，而不是出了事再扯皮。" }], tags: ["实时项目", "架构表达", "SLA"]
    },
    {
      id: "PRJ-005", category: "项目与开放题", question: "核心 T+1 任务延迟，距离 SLA 只剩一小时，你怎么处理？", frequency: 5,
      answer: `①先确认影响范围和关键路径，依据监控判断是上游未到、资源排队、倾斜、节点故障还是代码退化，并立即通知相关方。②优先恢复：扩容或换队列、隔离热点、从安全点重跑，必要时启用经过预案验证的降级数据。③持续更新预计时间；恢复后补齐全量校验、修正降级结果并复盘根因、检测和预案。`,
      detail: `应急时不要边猜边改生产代码。先保留日志和运行指标，选择可逆操作。降级方案可能是沿用昨日非核心维度、先产核心指标后补长尾，但财务等场景不可擅自给错数，必须由业务责任人确认。`,
      followUp: [{ q: "哪些数据可以降级，谁来决定？", a: "按数据等级事先划清：核心财务、考核指标不可降级，宁可延迟；非核心维度、长尾报表可用昨日数据降级；决定权在数据 Owner 加业务责任人，且写进预案——应急时只执行预案，不现场发明降级。" }, { q: "资源扩容仍无效下一步怎么办？", a: "说明瓶颈不在资源：回到关键路径——上游数据未到（扩容无用）、代码退化（回滚版本）、单 key 倾斜（扩容对单点无效）、存储或元数据服务故障；“扩容无效”这个实证本身就是最重要的诊断信息。" }], tags: ["SLA", "故障处理", "降级"]
    },
    {
      id: "PRJ-006", category: "项目与开放题", question: "请讲一个你解决 SQL 性能问题的完整思路。", frequency: 4,
      answer: `①先建立运行时长、扫描量、Shuffle、Task 分布和资源基线，用 EXPLAIN 定位瓶颈而非直接调参。②若是数据量问题做分区裁剪、过滤下推、预聚合；若是 Join 或聚合问题处理广播、倾斜、基数放大和分区数；再治理小文件和存储格式。③用同一输入对账结果并压测，量化耗时与资源下降。`,
      detail: `面试最好提供具体数字，例如“日任务从 70 分钟降到 18 分钟，Shuffle 从 4TB 降到 900GB”。同时说明为什么原 SQL 慢、每一步证据、方案代价和如何防止回归，而不是只说开启某个参数。`,
      followUp: [{ q: "优化后结果如何证明完全一致？", a: "同一输入双跑对账：行数、主键集合、关键指标（金额、计数）全等，维度组合级抽样比对；边界样本重点测（null、跨日、重复事件）；有条件就灰度并行跑几天再切流，把“应该没错”变成“证明没错”。" }, { q: "如果只能改一个地方你先改什么？", a: "改数据量而不是改参数：先做扫描裁剪（分区、列、过滤下推），这是多数慢 SQL 的最大杠杆；讲出你的依据——EXPLAIN 里扫描行数占比最高，而不是背“优化先看 Join”的口诀。" }], tags: ["性能优化", "EXPLAIN", "量化"]
    },
    {
      id: "PRJ-007", category: "项目与开放题", question: "业务需求频繁变化，数仓模型如何兼顾稳定与敏捷？", frequency: 4,
      answer: `①稳定层围绕业务过程、原子事实和一致维度建设，避免跟随报表布局变化；易变展示逻辑留在语义层或 ADS。②通过契约、版本、兼容字段和影响分析控制公共模型变更，小需求可用视图或配置快速交付。③定期根据复用率识别应下沉的公共逻辑，灰度迁移消费者，做到核心稳定、边缘敏捷。`,
      detail: `“全部做宽表”短期快但长期口径失控，“所有需求都先改公共层”又会拖慢交付。可采用双速治理：高复用、高风险逻辑严格评审，场景化逻辑允许在受控沙盒快速验证，成熟后再产品化下沉。`,
      followUp: [{ q: "如何判断一段逻辑应该下沉？", a: "三问判断：被两个以上消费方复用吗、属于统一业务定义吗、出错影响面广吗；全是就下沉公共层；展示层特有逻辑（排序、格式、图表组装）永不下沉；用复用率数据定期复审——下沉是持续演进，不是一次设计。" }, { q: "公共字段废弃如何推进消费者迁移？", a: "流程化推进：血缘拉出全部消费者名单，发废弃公告并设迁移期（新旧字段双写并行），提供迁移文档与支持，到期旧字段先只读后下线；核心是把“通知”落成可追踪的迁移任务清单，而不是群发了事。" }], tags: ["模型演进", "敏捷", "数据契约"]
    },
    {
      id: "BAS-009", category: "数仓基础概念", question: "Iceberg、Hudi、Delta Lake 这类湖表格式解决了传统数据湖的哪些痛点？", frequency: 4,
      answer: `①传统数据湖只有文件和目录，缺少原子提交、快照、并发控制与表级 Schema 管理，容易读到半成品。②湖表格式用元数据文件维护快照、分区和文件清单，支持 ACID、时间旅行、Schema 演进及增量读取。③选型看引擎兼容、更新频率、读写模式和运维生态，格式不是计算引擎的替代品。`,
      detail: `一次提交通常先写新数据文件和元数据，最后以原子方式发布新快照；读者绑定某个快照，因此不会看到提交中间态。删除或更新可用 Copy-on-Write 重写文件，也可用 Merge-on-Read 记录增量再在读取时合并。湖表格式把“文件集合”提升成可治理的表，但仍需 compaction、过期快照清理和小文件治理。`,
      followUp: [{ q: "时间旅行和备份有什么区别？", a: "时间旅行依赖仍保留的历史快照与数据文件，主要服务回溯查询、审计和误删恢复；它不是永久备份，过期快照清理后就无法访问，跨集群灾备还要独立复制。" }, { q: "Copy-on-Write 和 Merge-on-Read 怎么选？", a: "读多写少、追求查询简单时选 Copy-on-Write；更新频繁、希望低写放大时选 Merge-on-Read，但读取要合并增量文件并定期 compaction。面试要说明读延迟、写放大和维护成本的取舍。" }], tags: ["湖表格式", "ACID", "Schema 演进"]
    },
    {
      id: "CMP-011", category: "大数据组件原理", question: "请完整讲一遍 MapReduce Shuffle：Map 输出如何到达对应的 Reduce？", frequency: 5,
      answer: `①Map 读取 InputSplit，经 RecordReader 生成键值对；map 输出先按 Partitioner 选择 reducer，写入环形缓冲区。②达到阈值后分区、排序、可选 Combiner 并 spill 到本地磁盘，多个 spill 文件再 merge。③Reduce 端通过 HTTP 拉取所属分区，边拉边归并排序，进入 reduce 函数后把结果写回 HDFS。`,
      detail: "Shuffle 是 Map 和 Reduce 之间按 key 重新分发并排序数据的阶段。Map 端每个输出记录携带分区号，缓冲区满或达到 spill 百分比就按分区写临时文件；spill 前排序，同一 key 在分区内相邻，Combiner 只做安全的局部聚合。Map 完成后生成最终数据文件和索引。Reduce 端先 copy 各 Map 的对应分区，内存不足继续 spill，最后多路 merge，保证传给 reduce 函数的 key 有序且同 key 聚合。瓶颈通常来自网络传输、磁盘 IO、序列化和倾斜。",
      followUp: [{ q: "Shuffle 为什么一定要排序？", a: "排序让同一个 key 在 reducer 输入中连续，框架才能用迭代器按 key 分组并只保留当前分组；如果不排序，就要把所有 key 放进内存哈希表，无法稳定处理海量数据。" }, { q: "Map 端的 spill 文件为什么还要 merge？", a: "一个 Map 可能多次 spill，直接让 Reduce 拉多个文件会放大网络请求和文件句柄；merge 将它们按分区归并成少量最终文件，并建立索引，降低 Reduce 拉取开销。" }], tags: ["MapReduce", "Shuffle", "spill", "归并"]
    },
    {
      id: "CMP-012", category: "大数据组件原理", question: "MapReduce 的环形缓冲区、spill 和 merge 分别做什么？如何调参？", frequency: 5,
      answer: `①Map 输出写入内存缓冲区，元数据按 partition、key 排序；达到 io.sort.mb 的 spill 阈值后后台线程刷盘，Map 线程继续写另一块缓冲。②spill 前可执行 Combiner，多个 spill 最后 merge 成一个带索引的文件。③调参围绕内存、spill 次数和磁盘 IO，不能只盲目增大缓冲区，还要留出 JVM 与排序空间。`,
      detail: "典型流程是 buffer 使用率达到 io.sort.spill.percent 后启动 spill；后台线程按分区排序并写本地磁盘，主线程与其并行，缓冲区切换依赖可用空间。spill 文件过多会在 Map 结束时多路 merge，merge.factor 控制一次合并的输入数。生产排查看 spill 次数、Map 输出压缩比、本地磁盘利用率和 GC，再结合 mapreduce.task.io.sort.mb、mapreduce.map.sort.spill.percent 等参数做压测，避免因内存增大导致 Container OOM。",
      followUp: [{ q: "spill 时 Map 线程会完全停住吗？", a: "不一定：有剩余缓冲区时，spill 线程与 Map 线程并行；两块缓冲都满且刷盘跟不上时 Map 才会阻塞。因此 spill 频繁或磁盘慢会表现为 Map 端反压。" }, { q: "Map 输出压缩应该在哪一步开启？", a: "开启 mapreduce.map.output.compress 可压缩 spill 和网络传输的中间结果，通常 CPU 换 IO；选择 Snappy/LZ4 等解压快的 codec，最终结果是否压缩由 mapreduce.output.fileoutputformat.compress 独立控制。" }], tags: ["环形缓冲区", "spill", "merge", "中间结果压缩"]
    },
    {
      id: "CMP-013", category: "大数据组件原理", question: "Combiner 和 Reducer 有什么区别？哪些聚合不能使用 Combiner？", frequency: 5,
      answer: `①Reducer 是计算语义的一部分，每个 key 的所有 value 最终必须经过它；Combiner 是 Map 端可选的本地预聚合，只为减少 spill 和网络数据。②Combiner 必须满足可结合、结果仍可作为输入的要求，框架可执行零次、一次或多次。③求和、计数适合；求全局平均、TopN 等需额外保存中间状态，不能直接把最终结果当 Combiner 输出。`,
      detail: "Combiner 的正确性要求聚合函数满足结合律，且局部结果可以继续参与同一聚合。例如 sum 的局部和可再 sum，count 的局部计数可再相加；平均值不能直接平均局部平均值，应传 sum 与 count 两个状态。TopN 若只保留局部 TopN，在分区边界上仍可合并，但必须定义可合并的数据结构。不能把 Combiner 当作一定执行的业务逻辑，也不能在其中依赖全局顺序或外部副作用。",
      followUp: [{ q: "Combiner 执行次数是固定的吗？", a: "不是。框架可因数据量、spill 次数和配置决定执行零次、一次或多次；所以 Combiner 必须幂等且无外部副作用，不能依赖调用次数来累计状态。" }, { q: "平均值如何设计可合并的 Combiner？", a: "Map 端输出 (sum,count)，Combiner 把局部 sum 和 count 分别相加，Reducer 最后用总 sum 除以总 count；不要输出局部 avg 后再做 avg，否则不同分区样本量不等时会产生偏差。" }], tags: ["Combiner", "Reducer", "可结合聚合"]
    },
    {
      id: "CMP-014", category: "大数据组件原理", question: "MapReduce 的 Partitioner 如何决定数据去哪个 Reduce？如何实现全局排序？", frequency: 4,
      answer: `①默认 HashPartitioner 用 hash(key) 对 reducer 数取模，保证同 key 进入同一分区；自定义 Partitioner 可按业务区间、租户或复合键路由。②全局排序不能只靠单个 reducer，常用 TotalOrderPartitioner：先采样 key 划定分区边界，再让每个 reducer 负责连续 key 区间。③分区数、热点 key 和边界均需验证。`,
      detail: "Partitioner 的契约是相同 key 必须得到相同分区，且分区之间尽量均衡。Hash 适合均匀 key；按范围分区适合排序输出，但边界需要采样或预计算。TotalOrderPartitioner 通常由 InputSampler 采样并生成 partition file，Reduce 输出的分区顺序拼接后才是全局有序。若自定义分区破坏同 key 聚合，结果会出现重复分组；若边界偏斜，排序任务仍会长尾。",
      followUp: [{ q: "为什么 reducer 数量不是越多越好？", a: "Reducer 太少会单任务数据大、并行度不足；太多会产生大量小文件，增加调度、连接和 NameNode 元数据压力。应按数据量、单任务处理能力和下游文件治理目标估算，并观察实际长尾。" }, { q: "如何让同一用户的数据落到固定 reducer？", a: "把 user_id 作为 key 或自定义 Partitioner 的路由字段，使用稳定 hash；不要把随机盐直接作为最终分区 key，否则同一用户会被拆散，只有在专门处理倾斜并设计二阶段聚合时才加盐。" }], tags: ["Partitioner", "全局排序", "TotalOrderPartitioner"]
    },
    {
      id: "CMP-015", category: "大数据组件原理", question: "Reduce 端拉取 Shuffle 数据时，copy、merge、sort 的顺序和内存不够时怎么处理？", frequency: 4,
      answer: `①Reduce 启动多个 copy 线程从各 Map 节点拉取自己负责的分区，先放内存或本地磁盘。②内存段与磁盘段按 key 做多路归并，内存不足就先 spill，最终形成有序迭代器再调用 reduce。③调优看 copy 并发、缓冲区、merge.factor、网络超时和本地磁盘，避免并发过高把 NodeManager 或网络打满。`,
      detail: "Reduce Shuffle 是拉取模型：每个 reducer 只请求每个 Map 输出文件中属于自己的分区。小段可留在内存，超过阈值刷盘；merge 过程可以边 copy 边进行，最后把内存段与磁盘段合并。reduce 函数看到的是按 key 分组的 RecordIterator，并不需要一次性装入全部数据。生产中长尾可能来自单个热点 key、某个 Map 节点磁盘慢或网络抖动，要从任务日志的 fetch failed、copy 时间和分区大小分布定位。",
      followUp: [{ q: "Fetch Failed 一定是网络问题吗？", a: "不一定。还要排查 Map 输出已被清理、NodeManager 磁盘故障、HTTP 服务异常、超时配置和 Map 任务重试；先看具体异常码与对应 Map attempt，再决定重试、延长超时或清理坏节点。" }, { q: "Reducer 端为什么也会产生很多临时文件？", a: "不同 Map 的分片会分批拉取并在内存不足时 spill 到本地盘，磁盘段还要多轮 merge；Map 数量多、Reducer 缓冲小或网络到达不均都会增加临时文件和磁盘 IO。" }], tags: ["Reduce Shuffle", "copy", "merge", "Fetch Failed"]
    },
    {
      id: "CMP-016", category: "大数据组件原理", question: "MapReduce 的推测执行是什么？什么场景下反而不能开启？", frequency: 4,
      answer: `①推测执行发现同一阶段少数任务明显慢于同批任务时，在另一节点启动备份 attempt，谁先成功采用谁的结果。②它适合无副作用、节点偶发慢或坏盘造成的长尾；不适合会写外部系统、任务本身确定性慢或资源已紧张的作业。③关闭要分 map、reduce 或按队列配置，并监控重复资源消耗。`,
      detail: "推测执行解决的是 straggler 而不是数据倾斜：同一 task 的两个 attempt 读取相同输入，OutputCommitter 只提交一个成功结果。若任务把结果直接写 MySQL、调用外部 API 或发送消息，重复执行会产生副作用；即使写 HDFS，也要确保提交协议幂等。开启前需确认慢任务来自节点异常而非统一的慢分区，否则只是复制热点并消耗更多资源。",
      followUp: [{ q: "推测执行如何判断一个任务异常慢？", a: "框架按同阶段任务的进度和运行时长估算，只有明显落后于中位或阈值的 attempt 才触发；阈值受 speculation 等参数影响。回答应强调它是相对比较，不是固定秒数。" }, { q: "两个 attempt 都写出了结果怎么办？", a: "由 OutputCommitter 的 setup/commit 协议决定只提交获胜 attempt，其他 attempt 做 abort；自定义外部 Sink 必须自己实现幂等键、事务或去重，否则框架无法替你撤销副作用。" }], tags: ["推测执行", "长尾", "OutputCommitter"]
    },
    {
      id: "CMP-017", category: "大数据组件原理", question: "HDFS NameNode 的 fsimage、edits 和 HA JournalNode 分别解决什么问题？", frequency: 5,
      answer: `①fsimage 是元数据检查点，edits 记录之后的变更；NameNode 启动时加载前者并重放后者。②HA 用 Active/Standby、JournalNode 共享 edits 和 ZooKeeper 故障转移，Standby 持续追平。③客户端通过逻辑 nameservice 定位 Active，切换前需 fencing 防脑裂。`,
      detail: "NameNode 把目录、权限、块到 DataNode 的映射放在内存，不能每次操作都重写完整元数据，因此采用 fsimage+edits。Checkpoint 节点或 Standby 定期合并日志。HA 中 Active 写 edits 到多数 JournalNode，Standby 读取并应用，故障切换前必须 fencing 防止脑裂；共享存储只保存元数据日志，真正的数据块仍在 DataNode 副本中。",
      followUp: [{ q: "NameNode 宕机后数据块会丢吗？", a: "通常不会，DataNode 的块文件和副本仍在；影响是元数据服务不可用。若配置 HA，Standby 追平 edits 后可接管；没有 HA 时只能从 fsimage 和 edits 恢复 NameNode。" }, { q: "为什么故障切换必须 fencing？", a: "旧 Active 可能只是网络隔离但仍认为自己是主，若新旧同时写 edits 或响应客户端会造成脑裂和元数据冲突。fencing 通过杀进程、撤销存储写权等手段保证同一时刻只有一个 Active。" }], tags: ["NameNode", "fsimage", "edits", "HA"]
    },
    {
      id: "CMP-018", category: "大数据组件原理", question: "HDFS 小文件为什么会拖垮集群？除了合并文件还有哪些治理手段？", frequency: 5,
      answer: `①小文件同时消耗 NameNode 内存中的文件、目录和 block 元数据，造成 RPC、打开文件和调度开销；Map 任务数也会随文件数膨胀。②治理包括上游批量写、控制分区与并发、CombineFileInputFormat、定期 compaction 和归档。③合并必须保持分区、文件格式和可追溯批次，不能简单把不同粒度数据拼在一起。`,
      detail: "HDFS 适合大文件顺序吞吐，不适合每天大量几 KB 的结果文件。小文件不仅浪费磁盘块，还会让 Hive 每个文件产生 split，导致大量短 Map task，任务启动时间超过真正计算时间。工程上应从源头限制并发写入和动态分区数量，使用 ORC/Parquet 批量落盘；历史分区通过 compaction 合并，必要时用 HDFS Archive 或对象存储冷归档。",
      followUp: [{ q: "为什么不能把所有分区直接合成一个文件？", a: "分区是裁剪和生命周期管理的边界，跨分区合并会让查询扫描无关数据，也破坏按日期回刷和权限治理。应在单个分区或相同粒度范围内合并，并保留分区元数据。" }, { q: "CombineFileInputFormat 能彻底解决小文件吗？", a: "不能。它只是在读取侧把多个小文件打包给同一个 Map，减少 task 数；NameNode 元数据、存储碎片和下游写入问题仍存在，所以必须配合上游批量写和离线 compaction。" }], tags: ["HDFS", "小文件", "compaction", "CombineFileInputFormat"]
    },
    {
      id: "CMP-019", category: "大数据组件原理", question: "YARN 中 ResourceManager、NodeManager、ApplicationMaster 如何协作提交一个 MapReduce 作业？", frequency: 5,
      answer: `①客户端向 ResourceManager 申请 Application，上传作业包和配置到 HDFS。②RM 分配 Container 启动 MRAppMaster，AM 向 RM 申请 Map/Reduce 资源并根据机架、本地性调度。③NM 启动并监控各 Container，AM 跟踪 task、重试失败并汇报进度，作业完成后注销。`,
      detail: "RM 的 ResourceScheduler 只负责资源分配，ApplicationsManager 负责接收应用和启动 AM；AM 才了解 MapReduce 的任务数、输入分片和容错策略。NM 管理节点资源、日志和 Container 生命周期。Map 尽量靠近数据块，Reduce 在 Map 完成并有输出后拉取分区。AM 挂掉时 RM 可按重试策略重启新的 AM，但已完成 task 是否复用由框架决定。",
      followUp: [{ q: "YARN 的 Container 和进程是什么关系？", a: "Container 是内存、CPU 等资源额度加启动命令的抽象，NM 在其中启动一个或多个受控进程；它不是天然等同于 Docker 容器，隔离强度取决于 cgroup、权限和运行时配置。" }, { q: "为什么 Reduce 不能像 Map 一样追求数据本地性？", a: "Reduce 输入来自所有 Map 的同一分区，数据天然分散在多个节点；它主要优化网络拉取和磁盘合并，只有在特殊部署或缓存场景才可能获得局部性。" }], tags: ["YARN", "ResourceManager", "ApplicationMaster", "Container"]
    },
    {
      id: "CMP-020", category: "大数据组件原理", question: "Spark 从 RDD/DataFrame 到执行时，DAG、Stage、Task、Executor 分别是什么？", frequency: 5,
      answer: `①Driver 构建逻辑 DAG 和血缘，遇到 Action 后由 DAGScheduler 按宽依赖切 Stage。②每个 Stage 按分区生成 TaskSet，由 TaskScheduler 发给 Executor 执行；Executor 是应用独占进程，负责 task、缓存和 Shuffle。③窄依赖可流水线执行，宽依赖需落盘和跨节点 Shuffle，Stage 边界就在这里。`,
      detail: "Transformation 只记录算子和依赖，不立即计算；Action 触发 Job。DAGScheduler 从末端反向切分 Stage，ShuffleMapStage 先产生中间分区，ResultStage 消费它们。Task 是一个分区的一次计算，失败可重试；Executor 维护线程池、BlockManager 和 Shuffle 数据。DataFrame 还会经过 Catalyst 优化和 Whole-stage Codegen，但物理执行仍落到 task。",
      followUp: [{ q: "一个 Stage 里 Task 数量由什么决定？", a: "通常由该 Stage 输入或 Shuffle 输出的 partition 数决定，一个 partition 对应一个 task；不是由数据行数直接决定。分区太少并行度不足，太多则调度和小文件开销上升。" }, { q: "为什么调用 cache 后第一次 Action 仍然慢？", a: "cache 是惰性的，第一次 Action 才真正计算并物化分区；后续 Action 才能复用缓存。若内存不足发生 eviction，仍会重算或从磁盘读取。" }], tags: ["Spark", "DAG", "Stage", "Task"]
    },
    {
      id: "CMP-021", category: "大数据组件原理", question: "Spark AQE 如何处理运行时数据倾斜和分区过多？", frequency: 4,
      answer: `①AQE 在执行过程中读取真实统计信息，动态合并过小 Shuffle 分区，避免大量小 task。②检测到热点分区后可把它拆成多个子分区，与另一侧分片分别 Join，缓解单 key 长尾。③还可运行时切换 BroadcastHashJoin；但要确保统计可信、版本支持并观察额外计划开销。`,
      detail: "静态优化只能依赖编译时估算，数据分布变化时容易失准。AQE 在 Shuffle Map 阶段完成后获得每个分区大小，再重写后续物理计划：coalescePartitions 合并小分区，OptimizeSkewedJoin 拆分异常大的分区，Dynamic Join Selection 选择广播或排序合并。AQE 不是万能倾斜药，热点 key 造成的笛卡尔放大、外部 Sink 副作用和错误统计仍需要模型或 SQL 层治理。",
      followUp: [{ q: "AQE 拆分倾斜分区为什么不会重复结果？", a: "它按分区数据切成多个 map 输出片段，另一侧对应分区在读取时被复制到每个子任务，子任务只处理自己的片段；复制的是 Join 输入而非最终结果，框架仍按原 Join 语义输出一次匹配。" }, { q: "什么时候不应该开启 AQE？", a: "极低延迟、小数据任务或已经严格固定分区/计划的场景收益有限；另外老版本、外部数据源和自定义规则可能不兼容。应以同输入双跑的耗时、Shuffle 与结果一致性验证，而非盲目打开。" }], tags: ["Spark AQE", "倾斜拆分", "动态分区"]
    },
    {
      id: "CMP-022", category: "大数据组件原理", question: "Spark 的 persist/cache、checkpoint 和 lineage 分别解决什么问题？", frequency: 4,
      answer: `①Lineage 记录从输入到结果的不可变依赖，失败时按血缘重算，零额外存储但链路过长会恢复慢。②cache/persist 缓存分区供多次 Action 复用，适合热点中间结果，内存不足可落盘或淘汰。③checkpoint 把结果写到可靠存储并截断血缘，适合长链路、迭代计算和故障恢复。`,
      detail: "cache 是性能优化，不改变容错语义；persist 可选 MEMORY_ONLY、MEMORY_AND_DISK 等级。checkpoint 通常在 RDD 计算后写 HDFS，并在下一次作业中从 checkpoint 读取，代价是一次完整 IO。Structured Streaming 的 checkpoint 还保存 offset、状态和提交信息，是恢复 Exactly-Once 的必要元数据，不能与普通 RDD checkpoint 混为一谈。",
      followUp: [{ q: "checkpoint 前是否一定要先 cache？", a: "不是必须，但常见做法是先 cache 再触发一次 Action，避免 checkpoint 写入时重新计算上游；cache 只是加速，不是 checkpoint 的前置语义。" }, { q: "lineage 很长一定会导致 OOM 吗？", a: "不一定。血缘本身是元数据对象，主要风险是失败重算路径长、Driver 计划大以及迭代任务调度慢；对长链路适时 checkpoint 可截断依赖，不能只看内存。" }], tags: ["Spark", "cache", "checkpoint", "lineage"]
    },
    {
      id: "CMP-023", category: "大数据组件原理", question: "HBase RowKey 怎么设计，才能避免热点并支持主要查询？", frequency: 5,
      answer: `①RowKey 决定数据分布和定位，设计先列出查询条件，再权衡顺序扫描、范围查询和写入均衡。②时间递增写入会集中到最后一个 Region，可用盐桶、Hash 前缀或反转时间打散；但前缀会牺牲按时间全局扫描。③控制长度、避免高基数字段无谓拼接，并预分区验证热点。`,
      detail: "HBase 按 RowKey 字典序在 Region 内存储，Region 按 key 范围切分。单调递增 key（如时间戳）会让写入集中在一个 Region；加盐把写入分散到固定桶，查询时必须并行查所有桶再合并。反转时间适合“查最近记录”的范围扫描，但要拼接业务主键保证唯一。设计不是追求随机化，而是把最重要的查询和写入分布同时写成可验证的访问模式。",
      followUp: [{ q: "加盐后如何查询一个用户的全部记录？", a: "盐值必须是可计算的固定规则（如 hash(user_id)%N），查询时可直接算出一个桶；若盐随机且同一用户跨桶，就只能扫描 N 个桶，需评估 N 与查询并发。" }, { q: "为什么不把查询字段都放进 RowKey？", a: "RowKey 只能高效支持前缀或范围定位，字段组合一多会造成索引爆炸、更新困难和 key 过长；多条件查询通常用二级索引、Phoenix/ES 或反查表补足。" }], tags: ["HBase", "RowKey", "热点", "预分区"]
    },
    {
      id: "CMP-024", category: "大数据组件原理", question: "HBase 的 MemStore、Flush、Minor/Major Compaction 各在什么时候发生？", frequency: 4,
      answer: `①写入先追加 WAL，再写 RegionServer 的 MemStore，达到阈值后 Flush 成 HFile。②Minor Compaction 合并部分小 HFile，降低读放大；Major Compaction 合并一个 Store 的全部 HFile，并清理删除标记和过期版本。③Compaction 会占 IO，需按写入量、文件数、TTL 与读延迟设置策略，避免与高峰争抢。`,
      detail: "一次 Put 先写 WAL 以保证宕机恢复，再落 MemStore；Flush 将有序 MemStore 生成不可变 HFile。读取要查 MemStore 与多个 HFile，文件越多读放大越严重，因此后台 compaction 维护层级。删除在 HBase 中先写 tombstone，并不会立即物理删除，只有 Major Compaction 且满足 TTL/版本条件才清理。Compaction 与 flush 过于频繁会造成写放大，过慢又会拖慢读取和占满磁盘。",
      followUp: [{ q: "Major Compaction 期间会阻塞读写吗？", a: "现代 HBase 通常允许并发读写，但会抢占磁盘、IO 和 CPU，导致延迟抖动；线上一般错峰、限速或手动控制，不把 Major Compaction 当成无成本维护。" }, { q: "WAL 和 HFile 的顺序为什么不能反过来？", a: "先写 WAL 才能在 RegionServer 宕机时回放尚未 Flush 的 MemStore；如果先写内存再写 WAL，进程在两步之间崩溃就会丢失已确认写入。" }], tags: ["HBase", "MemStore", "HFile", "Compaction"]
    },
    {
      id: "CMP-025", category: "大数据组件原理", question: "Kafka Consumer Group 如何分配分区？Rebalance 会造成什么问题？", frequency: 5,
      answer: `①同一消费组内一个分区同一时刻只归一个消费者，消费者数量超过分区数时多出的实例空闲。②成员加入、退出、订阅变化或 session 超时会触发 Rebalance，分区暂时停止消费并重新分配。③降低频繁重平衡要控制 max.poll.interval、处理批量大小和心跳，使用静态成员或 cooperative sticky 策略。`,
      detail: "Consumer Group 通过协调者（通常是某个 Broker）管理成员、订阅和位点。分配器可选 Range、RoundRobin、Sticky、CooperativeSticky；传统 eager rebalance 会先撤销全部分区，cooperative 只增量迁移。重平衡期间可能造成消费停顿、重复处理和缓存失效；如果单批处理太久超过 max.poll.interval，协调者会认为消费者失联，即使心跳仍在也会踢出。",
      followUp: [{ q: "消费者数量大于分区数会怎样？", a: "多出的消费者不会分到分区，只保留心跳状态；吞吐并不会继续线性提升。扩容前应先评估分区数、单分区吞吐和下游处理能力，避免空转实例。" }, { q: "max.poll.interval.ms 与 session.timeout.ms 有什么区别？", a: "前者限制两次 poll 之间允许的业务处理时间，超时会触发再均衡；后者依赖心跳检测消费者是否存活。批处理慢应优先调整 poll 间隔或缩小 max.poll.records，不能只拉长 session timeout。" }], tags: ["Kafka", "Consumer Group", "Rebalance"]
    },
    {
      id: "CMP-026", category: "大数据组件原理", question: "Kafka 的幂等 Producer 和事务分别解决什么问题？", frequency: 5,
      answer: `①幂等 Producer 用 producer id 与 sequence number 让 Broker 去重，解决单分区重试产生的重复写。②事务把多个分区写入、消费位点提交和输出绑定成原子操作，解决“读—处理—写”跨分区一致性。③两者都不能替代业务幂等：事务有超时、状态机和下游可见性前提，消费端还需 read_committed。`,
      detail: "网络抖动时 Producer 可能已写成功但未收到响应，重试会造成重复；enable.idempotence 让 Broker 按 PID/序列号拒绝重复序列。事务 API 可把多分区 produce 与 sendOffsetsToTransaction 一起提交，消费者设置 isolation.level=read_committed 才不会读到 aborted 消息。事务保证 Kafka 日志内的原子性，写外部数据库或 OLAP 时仍要两阶段提交、幂等 Upsert 或 Outbox 等端到端方案。",
      followUp: [{ q: "开启幂等 Producer 后还能设置任意 acks 吗？", a: "不能按旧配置随意组合。现代 Kafka 会强制 acks=all，并限制 in-flight requests 等参数组合，以维持序列语义；显式配置应以客户端版本校验为准，别只背一个开关。" }, { q: "Kafka 事务超时会带来什么后果？", a: "事务未及时提交会被 Broker 终止，消费者在 read_committed 下看不到这批消息；应用重启后需从最近事务边界恢复。事务超时应大于 Checkpoint/处理窗口，同时监控悬挂事务和 abort 率。" }], tags: ["Kafka", "幂等", "事务", "Exactly-Once"]
    },
    {
      id: "CMP-027", category: "大数据组件原理", question: "Flink Checkpoint Barrier 如何穿过算子？对齐和非对齐 Checkpoint 有何取舍？", frequency: 5,
      answer: `①JobManager 触发 Checkpoint，Source 注入 Barrier；Barrier 随数据流经算子，算子收到所有输入的 Barrier 后快照状态并向下游转发。②对齐模式会暂存先到通道的数据，保证同一快照边界但可能因反压停顿。③非对齐模式把在途数据一并持久化，减少等待，却增加状态体积和恢复 IO。`,
      detail: "Barrier 把一条流切成 Checkpoint 前后两段。多输入算子必须等各通道的 Barrier 到齐，否则先到通道的后续数据会与另一通道的旧数据混在同一快照中。对齐缓冲位于输入通道，热点或反压严重时 alignment time 拉长；非对齐将 buffer 中的在途记录纳入快照，避免长时间阻塞，但 Checkpoint 变大且恢复时要重放更多网络数据。要结合端到端延迟、状态大小和反压指标选择。",
      followUp: [{ q: "Barrier 会不会丢失或重复？", a: "Flink 通过 checkpoint ID、通道状态和失败重启协议保证一致快照；Barrier 本身不是业务事件，失败后从最近成功 Checkpoint 恢复并重放数据，不能把它当作 Kafka 消息的 offset。" }, { q: "为什么 Source 必须参与 Checkpoint？", a: "只有 Source 把消费位点与算子状态放进同一快照，失败后才能从一致位置重放；若只保存算子状态、不保存位点，就可能漏读或重复读，端到端 Exactly-Once 无法成立。" }], tags: ["Flink", "Checkpoint", "Barrier", "对齐"]
    },
    {
      id: "CMP-028", category: "大数据组件原理", question: "Flink 反压是怎么形成和传播的？如何用指标定位瓶颈？", frequency: 5,
      answer: `①下游算子处理速度低于上游时，网络输出缓冲逐渐耗尽，Credit/缓冲区信号使上游发送受限，反压沿数据流向 Source 传播。②定位先看各算子的 busy、backPressured、idle、subtask 吞吐和 Checkpoint alignment，再区分 CPU、IO、外部 Sink、热点 key。③扩容只能解决可并行瓶颈，单 key、慢外部系统要改分区、缓存或异步 IO。`,
      detail: "Flink 网络栈采用 ResultPartition/InputGate 和 buffer pool，credit-based 流控让接收端以可用 buffer 数告知发送端。下游慢会造成 buffer backlog，最终上游阻塞。面试不要只说“网络慢”：通过 Web UI 的 backPressuredTimeMsPerSecond、busyTime、numRecordsIn/Out、checkpoint duration 与 sink latency 交叉判断。若一个 subtask 的 key 分布极不均，增加并行度也不会拆开同一个 keyed state，应采用 key 设计、热点拆分或异步外部访问。",
      followUp: [{ q: "为什么反压会让 Checkpoint 也变慢？", a: "Barrier 需要穿过算子和网络通道；反压时先到 Barrier 的通道会等待其他通道，alignment time 拉长，状态上传也可能排队。因此要把反压指标和 Checkpoint 延迟一起看。" }, { q: "如何判断是 Sink 慢而不是 Flink 计算慢？", a: "比较算子 busy/backpressure 与 records out：若 Sink subtask busy 高、输出吞吐低且外部请求延迟上升，通常是下游；若上游 CPU 满、GC 或单 key 长尾，瓶颈在计算。再做临时黑洞 Sink 对照压测。" }], tags: ["Flink", "反压", "Credit", "监控"]
    },
    {
      id: "CMP-029", category: "大数据组件原理", question: "Flink 事件时间窗口遇到迟到数据时，Watermark、allowed lateness 和侧输出怎么配合？", frequency: 5,
      answer: `①Watermark 表示某个并行输入大概率不会再有更早事件；窗口到达结束时间后触发计算。②allowed lateness 允许窗口继续接收迟到事件并触发更新，超过阈值的数据进入侧输出流。③必须说明结果是首次触发还是最终修正，配合下游 Upsert 或撤回语义，否则重复更新会污染指标。`,
      detail: "多并行 Source 的全局 Watermark 取各分区最小值，某个分区空闲不标记 idle 会拖住全局进度。窗口首次触发后，处于 allowed lateness 内的事件仍可更新状态；窗口状态清理后再到的数据只能侧输出。实时数仓常把结果写成 (window_start, group_key) 主键的 Upsert，或将修正事件送到离线校准链路，不能把每次触发都当成独立累加。",
      followUp: [{ q: "Watermark 越大越好吗？", a: "不是。延迟越小，结果越快但迟到丢弃和修正越多；延迟越大，完整性更好但实时性下降、状态保留更久。应根据业务可接受迟到分布和 SLA 设置 out-of-orderness。" }, { q: "某个 Kafka 分区长时间没数据会怎样？", a: "若 Source 不声明该分区 idle，全局 Watermark 会被它卡住，其他分区窗口也不触发；应启用 idleness 超时或在源端正确推进空闲标记，同时监控 idle 分区比例。" }], tags: ["Flink", "Watermark", "迟到数据", "窗口"]
    },
    {
      id: "CMP-030", category: "大数据组件原理", question: "Flink 状态后端、State TTL 和 RocksDB 增量 Checkpoint 如何影响实时数仓？", frequency: 4,
      answer: `①状态后端决定状态放内存还是外部化存储；大状态常用 RocksDB/EmbeddedRocksDB，换取容量和随机访问成本。②State TTL 控制状态过期，但 TTL 不是实时定时删除，清理时机取决于访问、后台 compaction 或快照。③增量 Checkpoint 只上传变化文件，降低网络和快照时间，但依赖文件复用、compaction 策略和稳定存储。`,
      detail: "Keyed State 按 key 分区，窗口、去重、Join 和聚合都依赖它。HeapState 访问快但受 JVM 堆限制，RocksDB 状态容量大、需序列化和本地磁盘。TTL 的可见性、更新策略和状态快照语义要显式配置，不能把过期时间当作精确删除时刻。增量 Checkpoint 复用上次已上传的 SST 文件，恢复时需要完整引用链；频繁 compaction 会削弱增量收益，磁盘和 checkpoint 目录必须监控。",
      followUp: [{ q: "TTL 能解决所有状态膨胀吗？", a: "不能。TTL 只对支持 TTL 的状态生效，且清理可能延迟；窗口无限增长、热点 key、广播状态和外部缓存仍需窗口边界、状态采样、key 拆分或独立过期策略。" }, { q: "RocksDB 一定比 HeapState 好吗？", a: "不是：小状态、低延迟作业用 HeapState 更快且运维简单；状态很大、需要防止 JVM OOM 或使用增量快照时才考虑 RocksDB。选型要用真实状态大小、读写频率和恢复 SLA 压测。" }], tags: ["Flink", "State TTL", "RocksDB", "增量 Checkpoint"]
    },
    {
      id: "DEV-012", category: "SQL 与数据开发", question: "Hive 的 ORC/Parquet、向量化执行和谓词下推为什么能加速查询？", frequency: 5,
      answer: `①列式格式只读取需要的列，同类型数据压缩率高；ORC 还保存 stripe、列统计和 Bloom Filter。②谓词下推把过滤条件尽量下沉到扫描层，利用 min/max 等统计跳过无关文件或 stripe。③向量化按批处理列数据，减少对象创建和解释调用；必须确认格式、引擎和函数支持，否则会退化。`,
      detail: "ORC 文件由 stripes、索引和文件级 Footer 组成，读取某列时可根据 stripe 统计裁剪；Parquet 以 row group 和 column chunk 组织，适合多引擎读取。谓词下推不等于一定能跳过数据：对分区列、简单比较和可下推函数效果最好，包裹列的 UDF 或隐式类型转换可能阻断优化。向量化执行把多行放进 batch，降低 JVM/解释器开销，适合扫描和聚合型 SQL。",
      followUp: [{ q: "为什么 select * 会抵消列式存储优势？", a: "列式格式仍有压缩和向量化收益，但 select * 会读取几乎所有列，列裁剪优势消失，网络与反序列化也变重；生产 SQL 应只选业务需要的列。" }, { q: "谓词下推和分区裁剪有什么区别？", a: "分区裁剪在目录层排除整分区，收益最大；谓词下推在文件格式内部根据列统计跳过 stripe/row group。两者可同时生效，不能把文件内下推当成分区裁剪。" }], tags: ["Hive", "ORC", "谓词下推", "向量化"]
    },
    {
      id: "DEV-013", category: "SQL 与数据开发", question: "Hive 分区和分桶有什么区别？什么时候用分桶？", frequency: 5,
      answer: `①分区把数据按目录字段切开，查询带分区条件时可裁剪目录，适合低基数、常用过滤列。②分桶把同一分区内数据按 hash 分散到固定文件，利于抽样、桶内排序和同桶 Join，但不会自动减少扫描。③分区过多会产生小文件，分桶数需与数据量、并行度和下游 Join 规划匹配。`,
      detail: "分区是物理目录层级，常用 dt、region 等字段；分桶是文件级组织，依赖 CLUSTERED BY 和写入严格执行。两个表按同一 key、同桶数分桶，某些引擎可做 bucket map join 或减少 Shuffle，但 Hive 版本和参数必须匹配，不能只声明分桶就获得收益。分桶表重写、扩容和历史数据治理成本较高，低频 Join 不值得为了概念使用。",
      followUp: [{ q: "分桶能替代分区吗？", a: "不能。分桶不提供目录级裁剪，查询仍可能扫描整个表；分区负责先缩小数据范围，分桶再优化分区内组织，二者是不同层次的手段。" }, { q: "分桶数如何估算？", a: "按单桶目标大小和 Join 并行度估算，保证每桶数据量适中且两表可对齐；不要追求过多桶，否则文件数、元数据和小文件成本会上升。上线后用实际分桶大小与 Join 计划校准。" }], tags: ["Hive", "分区", "分桶", "Bucket Join"]
    },
    {
      id: "DEV-014", category: "SQL 与数据开发", question: "Hive 动态分区为什么容易产生小文件或分区爆炸？如何安全使用？", frequency: 4,
      answer: `①动态分区由查询结果决定目录，省去逐分区写 SQL，但高基数分区会一次创建大量目录和文件，拖慢 NameNode 与 Metastore。②开启前限制单节点和总分区数，过滤非法或空分区值，控制 reducer 数并设置批次上限。③对稳定低基数维度可用，用户 ID 等高基数字段应改为普通列或分桶。`,
      detail: "动态分区写入通常由 Reduce 端按分区字段组织输出；数据倾斜会让某些 reducer 产生巨型文件，分区数量过多又会导致大量小文件。安全方案是严格模式优先、静态指定一级分区、动态只写低基数二级分区，配合 hive.exec.max.dynamic.partitions、max.dynamic.partitions.pernode 等阈值。任务后做分区数、文件数、空分区和异常值质量检查，失败要清理半成品再重跑。",
      followUp: [{ q: "动态分区失败后可以直接重跑吗？", a: "不能盲目重跑。先确认是否已经写入部分分区、任务是否幂等、目标分区是否需要覆盖；必要时删除本批次半成品或用临时表成功后原子替换，避免重复追加。" }, { q: "为什么动态分区字段通常放在最后？", a: "Hive 的写入列顺序与分区列声明有关，把分区列放在 select 最后便于明确“数据列+分区列”映射，减少列错位；真正标准应以表结构和团队规范为准。" }], tags: ["Hive", "动态分区", "小文件", "Metastore"]
    },
    {
      id: "DEV-015", category: "SQL 与数据开发", question: "Hive SQL 如何从语法解析变成执行计划？MR、Tez、Spark 引擎有什么差别？", frequency: 4,
      answer: `①Driver 接收 SQL，经 Parser 生成 AST，Analyzer 做表列与类型解析，Optimizer 做分区裁剪、Join 重排和列裁剪，Compiler 生成物理计划。②执行引擎把计划落成 MR、Tez DAG 或 Spark Job，再由 YARN 调度。③MR 通用但磁盘落地多；Tez 支持 DAG 减少中间写；Spark 适合内存复用，最终要看稳定性和生态。`,
      detail: "Hive 的 Metastore 提供表、分区和统计信息，语义分析阶段据此校验字段；物理优化会选择 map join、谓词下推、向量化等算子。MR 每个阶段边界都落 HDFS，容错清晰但延迟高；Tez 在一个 DAG 中连接多个 vertex，减少不必要的落盘；Spark SQL 交给 Catalyst/Tungsten 执行，适合复杂交互和迭代。切换引擎不等于结果自动一致，仍需验证 UDF、类型和资源配置。",
      followUp: [{ q: "EXPLAIN 中看到多个 Stage 应该怎么读？", a: "先沿数据流看 Scan、Filter、Join、Group By 和 FileSink，再关注每个 Stage 的输入输出、Reduce 数与是否发生 Shuffle；不要只看 Stage 数，优先找扫描量、倾斜和大 Shuffle。" }, { q: "为什么同一条 SQL 换引擎后耗时差异很大？", a: "执行模型、序列化、Shuffle 实现、缓存和 UDF 支持不同；先固定输入、分区、并发和资源，比较物理计划与 task 指标，再判断是引擎优势还是配置差异。" }], tags: ["Hive", "执行引擎", "Tez", "物理计划"]
    },
    {
      id: "DEV-016", category: "SQL 与数据开发", question: "Hive 的 UDF、UDAF、UDTF 有什么区别？为什么 explode 会改变结果行数？", frequency: 4,
      answer: `①UDF 是一进一出，如日期格式化；UDAF 是多行聚合成一个结果，如 sum、collect_set；UDTF 是一行展开多行，如 explode。②UDTF 常配 LATERAL VIEW，把数组或 Map 展开后再参与过滤和聚合。③要先声明输入粒度，注意空数组、null、重复元素和展开后的行数放大。`,
      detail: "UDF 在每行调用并返回一个值；UDAF 有 iterate、merge、terminate 等阶段，可在 Map/Reduce 端局部聚合；UDTF 返回一个 StructObjectInspector 描述的多列或多行结果。LATERAL VIEW 把 UDTF 与原表关联，默认 explode(null) 或空集合可能不产生行，outer 变体可保留原行。展开一对多后再 Join 另一张明细表很容易产生笛卡尔放大，必须先明确粒度和去重策略。",
      followUp: [{ q: "explode 和 posexplode 有什么区别？", a: "explode 只返回元素，posexplode 额外返回元素下标；需要保留数组顺序、重建位置或按位置对齐时用 posexplode。Map 展开则通常返回 key、value 两列。" }, { q: "UDAF 为什么需要 merge？", a: "分布式聚合会先在多个 Map 或 partial 阶段生成中间状态，merge 把这些状态合并，最后 terminate 输出结果；中间状态必须可序列化且可结合，否则无法并行。" }], tags: ["Hive", "UDF", "UDAF", "UDTF"]
    },
    {
      id: "DEV-017", category: "SQL 与数据开发", question: "Hive 中 NULL 参与 Join、count 和 not in 时有哪些坑？", frequency: 5,
      answer: `①NULL 表示未知，NULL = NULL 不是 true，等值 Join 不会匹配两端 NULL。②count(*) 统计行数，count(col) 不统计 col 为 NULL 的行，count(distinct col) 还会忽略 NULL。③not in 遇到子查询 NULL 可能整体返回空集，反连接优先用 NOT EXISTS 或显式过滤 NULL，并统一未知值语义。`,
      detail: "SQL 使用三值逻辑：TRUE、FALSE、UNKNOWN，WHERE 只保留 TRUE。left join 后右表字段可能为空，不能直接用 count(右表字段) 当左表行数；要统计匹配行可 count(右表主键) 或 sum(case when ...)。反连接用 NOT EXISTS 时仍需处理业务键 NULL；如果把 NULL 替换成 -1，必须保证该哨兵值不可能与真实业务键冲突，并在模型契约中说明。",
      followUp: [{ q: "如何统计左表每个用户是否匹配到右表？", a: "按右表非空主键计数：count(r.id)>0 或 max(case when r.id is not null then 1 else 0 end)。不要 count(*)，因为 left join 即使未匹配也会保留一行。" }, { q: "NULL 和空字符串要不要统一？", a: "先区分业务含义：NULL 多表示未知/缺失，空字符串可能表示明确为空。若源系统语义不一致，应在 ODS 保留原值、DWD 统一规则，并把转换记录进数据质量和指标口径。" }], tags: ["Hive", "NULL", "三值逻辑", "NOT EXISTS"]
    },
    {
      id: "DEV-018", category: "SQL 与数据开发", question: "Hive CBO 依赖哪些统计信息？统计信息不准会造成什么后果？", frequency: 4,
      answer: `①CBO 依据表、分区、列的行数、文件大小、NDV、最小最大值和空值数估算代价，选择 Join 顺序、广播或 Shuffle 方案。②统计信息过期会误判小表大小、分区基数和倾斜程度，导致错误 Join 计划或 reducer 数。③装载和回刷后及时 ANALYZE，监控估算与实际扫描量差异，关键任务可通过 hint 或基线兜底。`,
      detail: "CBO 不是只看文件大小：列级 NDV 影响 Join 选择性，分区统计影响裁剪和数据量估算。增量写入、删除、压缩和历史回刷都会让统计过期；自动采集可能因成本被关闭。排查时对比 EXPLAIN 的 estimated rows 与执行页面的实际 rows，重点看 Join 两侧放大倍数和是否触发 MapJoin。hint 是临时止血，长期要把统计采集纳入调度与质量门禁。",
      followUp: [{ q: "为什么只收集表级统计还不够？", a: "表级行数无法描述过滤列的选择性和 Join key 基数，CBO 可能把高基数列当成低基数，错误估算 Shuffle；分区和关键列统计才有足够信息。" }, { q: "统计信息收集本身很慢怎么办？", a: "优先收集高频 Join/过滤列和新增分区，使用采样或增量统计；对稳定历史分区复用结果，对关键表在装载完成后异步采集，避免把全库 ANALYZE 放进 SLA 主链路。" }], tags: ["Hive CBO", "统计信息", "NDV", "执行计划"]
    },
    {
      id: "LAB-009", category: "高频 SQL 手撕题", question: "给定用户行为日志，按 30 分钟无行为切分会话，求每个用户每天的会话数和平均会话时长。", frequency: 5,
      answer: `①按用户、事件时间排序，用 lag 取上次事件；当前事件与上次间隔大于 30 分钟或没有上次事件时标记新会话。②对标记做累加得到 session_no，再按用户、日期、session_no 聚合首尾时间。③会话时长按 max-min，单事件会话为 0；先去重同一事件，明确跨自然日会话归属。`,
      detail: "建表：\n```sql\nCREATE TABLE user_action(user_id BIGINT,event_time TIMESTAMP,event_id STRING,dt STRING) STORED AS ORC;\n```\n解题 SQL：\n```sql\nWITH e AS (\n SELECT user_id,event_time,dt,\n        lag(event_time) OVER(PARTITION BY user_id ORDER BY event_time) AS prev_time\n FROM (SELECT DISTINCT user_id,event_time,event_id,dt FROM user_action) s\n), f AS (\n SELECT *,sum(CASE WHEN prev_time IS NULL OR unix_timestamp(event_time)-unix_timestamp(prev_time)>1800 THEN 1 ELSE 0 END)\n          OVER(PARTITION BY user_id ORDER BY event_time ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS session_no\n FROM e\n), sessions AS (\n SELECT user_id,dt,session_no,min(event_time) start_time,max(event_time) end_time\n FROM f GROUP BY user_id,dt,session_no\n)\nSELECT dt,count(*) session_cnt,avg(unix_timestamp(end_time)-unix_timestamp(start_time)) avg_seconds\nFROM sessions GROUP BY dt;\n```\n关键是“间隔标记—累计编号—会话聚合”的 gaps-and-islands 模式；若会话跨日，需先按用户编号再按业务规则归属。",
      followUp: [{ q: "事件乱序会影响会话切分吗？", a: "SQL 先按事件时间排序可处理同批乱序；若流式实时计算，应使用事件时间和 Watermark，等水位推进后再关闭会话，并给迟到事件保留修正窗口。" }, { q: "同一时间有多个事件如何稳定排序？", a: "在 event_time 后追加 event_id 或源端递增序列作为 tie-breaker；否则窗口排序不稳定，重跑可能让 lag 结果变化。" }], tags: ["SQL 手撕", "会话", "gaps-and-islands", "lag"]
    },
    {
      id: "LAB-010", category: "高频 SQL 手撕题", question: "给定订单金额表，求每天的中位数和 P90，并说明 Hive 中精确与近似算法的取舍。", frequency: 4,
      answer: `①精确中位数可按天排序后用 row_number 与 count 定位中间一条或两条再平均，数据量大时排序成本高。②Hive 可用 percentile 得到精确结果，percentile_approx 用可控误差换资源和速度。③先过滤有效订单、明确金额精度与退款处理，P90 需说明是离散分位还是连续插值口径。`,
      detail: "建表：\n```sql\nCREATE TABLE order_amount(order_id BIGINT,amount DECIMAL(18,2),pay_time TIMESTAMP,dt STRING) STORED AS ORC;\n```\n解题 SQL：\n```sql\nSELECT dt,\n       percentile_approx(CAST(amount AS DOUBLE),0.5,10000) AS median_amount,\n       percentile_approx(CAST(amount AS DOUBLE),0.9,10000) AS p90_amount\nFROM order_amount\nWHERE amount IS NOT NULL AND amount>=0\nGROUP BY dt;\n```\npercentile_approx 的第三个参数控制近似摘要精度，越大通常越耗内存；若数据规模小且版本支持，可改为 percentile。面试要说清“近似不是错误”，而是延迟、资源与误差的工程权衡。",
      followUp: [{ q: "为什么不能用 avg 代替中位数？", a: "平均值会被极端大单拉高，不能代表分布中心；中位数按排序位置定义，对长尾更稳。订单金额常长尾，面试应主动说明均值和 P50 的解读不同。" }, { q: "percentile_approx 的误差如何验证？", a: "在可承受规模上用精确 percentile 做抽样基准，对比多个分位点的绝对/相对误差，并把摘要精度、数据分布和版本配置固化到指标定义。" }], tags: ["SQL 手撕", "中位数", "P90", "percentile_approx"]
    },
    {
      id: "LAB-011", category: "高频 SQL 手撕题", question: "如何计算严格按时间顺序完成 A→B→C 的用户转化率，而不是只统计做过三个事件的用户？", frequency: 5,
      answer: `①先按用户取 A 的最早时间，再取严格晚于 A 的最早 B，最后取严格晚于 B 的最早 C。②分别统计 A、有效 B、有效 C 的去重用户数，转化率分母固定为上一层人数。③同一事件重复、跨天窗口和时间相等要有明确处理，不能用三个独立 count 直接相除。`,
      detail: "建表：\n```sql\nCREATE TABLE user_event(user_id BIGINT,event_type STRING,event_time TIMESTAMP,dt STRING) STORED AS ORC;\n```\n解题 SQL：\n```sql\nWITH a AS (SELECT user_id,min(event_time) t_a FROM user_event WHERE event_type='A' GROUP BY user_id),\nb AS (SELECT a.user_id,min(e.event_time) t_b FROM a JOIN user_event e ON e.user_id=a.user_id AND e.event_type='B' AND e.event_time>a.t_a GROUP BY a.user_id),\nc AS (SELECT b.user_id,min(e.event_time) t_c FROM b JOIN user_event e ON e.user_id=b.user_id AND e.event_type='C' AND e.event_time>b.t_b GROUP BY b.user_id)\nSELECT count(a.user_id) a_uv,count(b.user_id) b_uv,count(c.user_id) c_uv,\n       count(b.user_id)/count(a.user_id) a_b_rate,count(c.user_id)/count(b.user_id) b_c_rate\nFROM a LEFT JOIN b ON a.user_id=b.user_id LEFT JOIN c ON b.user_id=c.user_id;\n```\n核心是逐层推进状态，保证顺序和分母语义；若要求 24 小时内完成，在每一步增加时间窗口条件。",
      followUp: [{ q: "A、B、C 同一时间戳是否算完成顺序？", a: "要看业务语义。若必须严格先后，用大于；若事件只有秒级时间且允许同秒顺序，用源端 sequence 或 event_id 做稳定排序，不能默认为相等可通过。" }, { q: "为什么不能用 conditional aggregation 一次扫表？", a: "一次扫表只能说明用户做过各事件，不能保证 B 在 A 后、C 在 B 后；严格漏斗需要排序或逐层关联，代价更高但语义正确。" }], tags: ["SQL 手撕", "漏斗", "严格时序", "转化率"]
    },
    {
      id: "LAB-012", category: "高频 SQL 手撕题", question: "给定每日用户活跃表，求连续三天增长的用户，并输出增长起止日期。", frequency: 4,
      answer: `①先按用户、日期去重并计算当日活跃值，再用 lag 取前一日和前二日。②筛选 value>lag1 且 lag1>lag2，同时要求日期连续，避免跨天比较。③若要输出最长增长段，先按条件标记断点，再用累计和分组聚合；明确“增长”比较的是人数、金额还是次数。`,
      detail: "建表：\n```sql\nCREATE TABLE user_daily_metric(user_id BIGINT,dt STRING,metric_value BIGINT) STORED AS ORC;\n```\n解题 SQL：\n```sql\nWITH d AS (\n SELECT user_id,dt,metric_value,\n        lag(dt,1) OVER(PARTITION BY user_id ORDER BY dt) d1,\n        lag(dt,2) OVER(PARTITION BY user_id ORDER BY dt) d2,\n        lag(metric_value,1) OVER(PARTITION BY user_id ORDER BY dt) v1,\n        lag(metric_value,2) OVER(PARTITION BY user_id ORDER BY dt) v2\n FROM user_daily_metric\n), x AS (\n SELECT *,datediff(dt,d1)=1 AND datediff(d1,d2)=1 AND metric_value>v1 AND v1>v2 ok\n FROM d\n)\nSELECT user_id,dt AS growth_end, date_sub(dt,2) AS growth_start\nFROM x WHERE ok;\n```\n日期字符串需可被 datediff 解析；若中间日期缺失，不能把两条相邻记录误认为连续自然日。",
      followUp: [{ q: "metric_value 为 NULL 如何处理？", a: "先定义缺失是否等于 0。通常 NULL 表示未知，不应直接参与大小比较；可过滤该段、补零或沿用业务快照值，但必须在答案中说明口径。" }, { q: "如何找出最长连续增长段？", a: "先把每一天是否满足增长标为 1，再用不满足条件或日期断点生成分组号，按用户和组聚合起止日期及长度，最后 row_number 取最长。" }], tags: ["SQL 手撕", "连续增长", "lag", "日期连续"]
    },
    {
      id: "SYN-009", category: "数据同步", question: "从 MySQL 做全量加增量同步时，如何保证全量快照和 Binlog 增量不重不漏？", frequency: 5,
      answer: `①先在同一事务快照内记录 binlog 起始位点，再读取一致性全量；全量完成后从该位点消费增量并按主键版本合并。②不能用“全量结束时间”粗略切割，要处理全量读取期间发生的更新、删除和位点过期。③落地需保存 source 位点、批次、事务号，Sink 采用幂等 Upsert 并做行数、最大位点和金额对账。`,
      detail: "可靠做法是 snapshot plus binlog：在可重复读快照建立时拿到 binlog position/GTID，快照读取看到一致时点；期间产生的变更会在增量阶段按位点重放。若工具先全量再订阅，必须有锁表或源端保留足够 Binlog，并做位点重叠去重。对更新乱序可比较 source commit timestamp/LSN，删除用 tombstone 或 op 字段传递，最终通过水位和业务键差集验证覆盖范围。",
      followUp: [{ q: "全量和增量同时写目标表会不会互相覆盖？", a: "会，所以要么先写全量临时表再按位点合并，要么让 Sink 按版本只接受更新版本更大的记录；不能依赖到达顺序。最终切换前要对同一主键做版本对账。" }, { q: "Binlog 位点过期了怎么办？", a: "无法继续从旧位点增量恢复时，重新做一次一致性全量并建立新起点；同时告警位点滞后和保留窗口，不能跳过缺失区间后声称数据完整。" }], tags: ["全量增量", "Binlog", "快照", "位点"]
    },
    {
      id: "SYN-010", category: "数据同步", question: "CDC 事件乱序、重复、删除和更新覆盖如何在数仓侧处理？", frequency: 5,
      answer: `①以主键加源端单调版本、LSN 或 commit timestamp 排序，版本小的更新丢弃，重复事件按 event_id 去重。②DELETE 必须保留 op/tombstone，不能把缺失记录误当作未同步。③流表落地用 Upsert/主键模型，离线明细保留原始变更，设置迟到窗口、重放策略和最终对账。`,
      detail: "网络重试和多分片 Binlog 会造成重复与乱序，处理逻辑应把“事件顺序”与“到达顺序”分离。对状态表可按 source_lsn 最大值更新；对不可比较的时间戳要使用事务 ID、文件位点或源端版本。删除事件先写入带 op='D' 的变更表，物化当前表时过滤 tombstone；如果还要保留历史，应该在 DWD 记录有效期而不是物理删除。水位推进后再关闭批次，迟到事件进入补偿回刷。",
      followUp: [{ q: "只有更新时间没有单调版本怎么办？", a: "先确认源端时间精度和时区；可组合更新时间、主键和事件序列做确定性排序，但这只是近似。关键业务应推动源系统提供 LSN/事务位点，否则只能接受迟到修正并做对账。" }, { q: "如何验证 CDC 没有漏删？", a: "按批次统计各 op 数量、主键集合和最大位点，并与源端 Binlog/变更审计表对账；当前快照还要抽样查询已删除主键是否不再可见。" }], tags: ["CDC", "乱序", "删除", "幂等"]
    },
    {
      id: "SYN-011", category: "数据同步", question: "源表 Schema 变更时，数据同步链路怎样做到兼容和可回滚？", frequency: 4,
      answer: `①新增 nullable 字段通常向后兼容；删列、改类型、改语义属于破坏性变更，必须走数据契约和审批。②ODS 保留原始事件，DWD 通过版本化表或兼容视图映射，消费者先双读/双写再切换。③Schema Registry、字段血缘、样本校验和回滚版本共同防止静默错数，不能只依赖同步工具自动建表。`,
      detail: "Schema evolution 的危险不只是任务失败：同名字段改单位、状态枚举或时间时区可能静默改变指标。建议将 Schema 与事件版本绑定，生产者先注册变更并做兼容性检查；采集层落原始 payload 和 schema_version，标准层按版本解析。删除字段要保留迁移窗口，目标表可新增兼容字段；切换时双跑比较行数、空值率、分布和关键指标，失败可回退到旧解析器。",
      followUp: [{ q: "为什么不能直接让 Flink CDC 自动同步 DDL？", a: "自动同步只能解决结构传播，无法判断字段语义、历史回刷和下游报表影响；DDL 通过不代表数据契约通过。应让工具执行机械变更，治理平台负责兼容性和影响分析。" }, { q: "改字段类型怎样避免精度损失？", a: "先评估源值范围、精度和下游方言，优先采用可容纳旧值的新类型并保留旧列一段时间；抽样比较转换前后最大值、和与溢出数，确认无损再切换。" }], tags: ["Schema 演进", "数据契约", "DDL", "兼容性"]
    },
    {
      id: "DIM-013", category: "维度表设计", question: "维度代理键和业务自然键怎么选？为什么事实表通常不直接使用自然键？", frequency: 5,
      answer: `①自然键来自源业务，如 user_id；代理键是数仓生成的无业务含义整数或 hash。②SCD2 中同一自然键会有多个历史版本，代理键能唯一标识版本，事实按事件时点关联正确属性。③保留自然键用于回溯和跨源映射，代理键生成要幂等、稳定，并准备未知成员键。`,
      detail: "如果事实只保存 user_id，维度更新后历史订单 Join 当前维度会被错误归因；SCD2 用 customer_sk 区分不同有效区间，事实装载时按业务日期查到对应代理键。代理键还隔离源系统主键变更、合并和多源冲突。工程上要维护 natural_key→sk 的映射、unknown=-1、not_applicable=-2 等保留行，避免维度迟到导致事实无法关联。",
      followUp: [{ q: "代理键用自增 ID 会有问题吗？", a: "单机自增可能在分布式并行装载、回刷和多环境迁移时不稳定；可使用集中序列、雪花 ID 或基于规范化自然键和版本的稳定 hash，但要评估碰撞与长度。" }, { q: "事实表为什么还要保留自然键？", a: "代理键便于关联版本，自然键便于对接源系统、排查和重放；两者职责不同，保留自然键不代表事实用它做唯一维度关联。" }], tags: ["代理键", "自然键", "SCD2", "未知成员"]
    },
    {
      id: "DIM-014", category: "维度表设计", question: "迟到维度到达时，事实表应该如何处理未知成员和后续修正？", frequency: 5,
      answer: `①事实先用 unknown 代理键落地，保证批次不因维度迟到而失败，同时保留自然键和装载批次。②维度到达后只修正受影响事实，按自然键和业务时间重新查版本，幂等回刷。③若业务允许先出结果可暂时归到未知；财务或归因场景要阻断或标记不完整，不能静默丢失。`,
      detail: "迟到维度常见于主数据审批晚于交易、跨系统同步延迟或 SCD2 起始时间回溯。维度表维护 unknown/-1 行，事实装载记录 dimension_lookup_status；后续补偿任务按该状态和自然键定位候选事实，避免全表扫描。修正时要使用事实业务时间而非当前时间匹配 SCD2，有效版本确定后更新代理键，并对修正前后指标差异做审计。",
      followUp: [{ q: "为什么不让事实任务一直等待维度？", a: "等待会放大上游延迟并影响 SLA；是否等待取决于业务等级。核心财务可设置最大等待窗口并阻断，普通运营链路采用 unknown 加补偿，关键是把策略写成数据契约。" }, { q: "事实已经汇总到 DWS 了，还要修正吗？", a: "要。迟到维度导致的归因指标已在汇总层错误，必须沿血缘重算受影响粒度或在汇总层做反向冲正；只修 DWD 不会自动改变已落地的 ADS。" }], tags: ["迟到维度", "unknown", "补偿回刷", "代理键"]
    },
    {
      id: "DIM-015", category: "维度表设计", question: "角色扮演维度是什么？订单中的下单日期、支付日期、发货日期如何复用日期维度？", frequency: 4,
      answer: `①同一物理日期维度在事实中扮演不同角色，如 order_date_sk、pay_date_sk、ship_date_sk，各自关联同一 dim_date 的不同语义。②不要复制三张物理表，语义层或 SQL 别名负责角色区分。③每个日期键允许未知值，明确时区、自然日转换和事实粒度，避免把处理日期误当业务日期。`,
      detail: "角色扮演维度的关键是“同一维度不同业务语义”。查询订单履约时可分别 left join dim_date d_order、d_pay、d_ship，得到下单月、支付周和发货节假日属性。物理表统一维护节假日、财务期和工作日，减少重复治理；模型字段名必须带角色后缀，指标字典也要写清用哪一个日期，否则同一事实会出现多个合法但含义不同的时间口径。",
      followUp: [{ q: "订单事实应该只有一个 date_id 吗？", a: "不应该。一个业务过程有多个重要日期就保存多个角色外键；如果只保存装载日期，会丢失履约时序和按业务日期分析的能力。" }, { q: "支付日期为空时用下单日期代替可以吗？", a: "一般不可以，代替会把“未支付”伪装成“下单日支付”。应使用 unknown 或 NULL，并在指标定义中规定是否排除未支付订单。" }], tags: ["角色维度", "日期维度", "多日期", "时间口径"]
    },
    {
      id: "RT-011", category: "实时数仓", question: "Flink 的窗口、触发器和增量聚合如何配合？为什么全量窗口函数可能撑爆状态？", frequency: 4,
      answer: `①窗口负责按时间或数量划分数据，Trigger 决定何时计算，ProcessWindowFunction 提供窗口上下文。②Reduce/AggregateFunction 可增量维护 sum、count 等状态，避免每次触发遍历整个窗口；需要窗口元数据时再结合 ProcessWindowFunction。③窗口大小、允许迟到和状态 TTL 要与业务 SLA 一起设置。`,
      detail: "滚动、滑动和会话窗口都需要保存窗口归属。全量窗口函数把窗口内所有元素缓存在状态，事件量大时内存和 Checkpoint 体积随窗口增长；增量聚合只保存中间值，通常把状态从 O(n) 降到 O(1)，但不适合需要完整明细排序、去重列表等逻辑。窗口触发可能多次，结果 Sink 要支持更新或撤回，不能把每次触发简单 append。",
      followUp: [{ q: "AggregateFunction 和 ReduceFunction 有什么差别？", a: "两者都能做增量聚合；AggregateFunction 可把输入类型、累加器类型和输出类型分离，适合 sum/count 组合和更复杂状态，ReduceFunction 要求输入与输出同类型。" }, { q: "滑动窗口为什么状态量容易变大？", a: "窗口每 slide 都会重叠，同一事件可能属于多个窗口，状态副本数约等于 window_size/slide；应使用增量聚合、合理 slide、TTL 和状态监控控制开销。" }], tags: ["Flink", "窗口", "Trigger", "增量聚合"]
    },
    {
      id: "RT-012", category: "实时数仓", question: "实时数仓中的 Upsert、撤回流和幂等 Sink 如何避免窗口重复更新？", frequency: 5,
      answer: `①窗口或维度修正会产生同一业务键的新版本，Sink 要么按主键 Upsert 并比较版本，要么输出 before/after 撤回流。②Kafka 结果需配置 compact 或下游去重，Doris/StarRocks 选择主键模型并处理 delete sign。③Exactly-Once 只保证处理语义，最终展示正确还依赖下游更新协议、版本列和重放一致性。`,
      detail: "实时聚合不是只增不改：迟到事件、撤回、维度更新都会让旧窗口结果失效。设计结果表时把 window_start、维度键和指标版本作为唯一业务键，写入时只接受更大版本；若引擎支持 retract，则发送 -old/+new 两条变化。对于 Kafka，log compaction 只保留 key 的最新记录，不等同于立即删除旧消息；消费端仍要处理 tombstone 和重复重放。",
      followUp: [{ q: "版本列用处理时间还是事件时间？", a: "按结果语义选：事件时间反映业务版本，处理时间可作为并列打散和审计；乱序场景不能只用处理时间覆盖更晚到达的旧事件，最好使用源端序列或单调版本。" }, { q: "Upsert 表能直接做 SUM 吗？", a: "要看引擎模型。主键表通常在存储层保留最新行，查询再按当前值聚合；如果把每次增量都当追加事实做 SUM，就会重复累计，必须区分状态表和事件表。" }], tags: ["实时数仓", "Upsert", "撤回流", "版本"]
    },
    {
      id: "RT-013", category: "实时数仓", question: "Doris、StarRocks 的主键模型和 Duplicate 模型有什么差异？实时数仓怎么选？", frequency: 4,

    const q = currentInterview(); if (!q) return;
    document.getElementById("interviewCounter").textContent = `本轮第 ${memory.interviewIndex + 1} / ${memory.interviewQueue.length} 题 · 剩余 ${memory.interviewQueue.length - memory.interviewIndex - 1} 题`;
    document.getElementById("interviewCategory").textContent = q.category; document.getElementById("interviewStars").innerHTML = stars(q.frequency); document.getElementById("interviewStars").setAttribute("aria-label", `考察频率 ${q.frequency} 星`); document.getElementById("interviewQuestion").textContent = q.question;
    const fav = document.getElementById("interviewFavorite"); fav.innerHTML = starIcon(isFavorite(q.id)); fav.classList.toggle("active", isFavorite(q.id)); fav.setAttribute("aria-label", isFavorite(q.id) ? "取消收藏" : "收藏此题");
    const revealed = memory.interviewSession.revealed.has(q.id);
    document.getElementById("interviewAnswer").textContent = q.answer; document.getElementById("interviewAnswer").hidden = !revealed;
    document.getElementById("revealInterviewBtn").hidden = revealed; document.getElementById("nextInterviewBtn").hidden = !revealed;
    document.getElementById("interviewStatus").innerHTML = statusButtons(q.id);
  }
  function revealInterview() {
    const q = currentInterview(); if (!q) return;
    memory.interviewSession.revealed.add(q.id);
    document.getElementById("interviewAnswer").hidden = false; document.getElementById("revealInterviewBtn").hidden = true; document.getElementById("nextInterviewBtn").hidden = false;
    document.getElementById("nextInterviewBtn").focus();
  }
  function nextInterview() {
    if (memory.interviewIndex >= memory.interviewQueue.length - 1) {
      memory.interviewSession.completed = true; showInterviewView("summary"); renderInterviewSummary(); document.getElementById("restartInterviewBtn").focus(); return;
    }
    memory.interviewIndex++; renderInterviewQuestion();
  }
  function renderInterviewSummary() {
    const seen = Math.min(memory.interviewIndex + 1, memory.interviewQueue.length);
    const marked = Object.values(memory.interviewSession.marked);
    const learning = marked.filter(value => value === "learning").length;
    const mastered = marked.filter(value => value === "mastered").length;
    document.getElementById("interviewSummaryText").textContent = `本轮共抽取 ${memory.interviewQueue.length} 题，已完成 ${seen} 题。标记统计仅计算本轮主动调整过的题目。`;
    document.getElementById("interviewSummaryStats").innerHTML = `<div class="summary-stat"><b>${memory.interviewSession.revealed.size}</b>已翻答案</div><div class="summary-stat"><b>${learning}</b>标记学习中</div><div class="summary-stat"><b>${mastered}</b>标记已掌握</div>`;
  }
  function resetInterviewSession() {
    memory.interviewQueue = []; memory.interviewIndex = -1; memory.interviewSession = { revealed: new Set(), marked: {}, completed: false };
    document.getElementById("openInterviewBtn").textContent = "模拟面试";
    showInterviewView("setup"); document.getElementById("startInterviewBtn").focus();
  }
  function setupInterviewCategories() {
    document.getElementById("interviewCategories").innerHTML = CATEGORIES.map(category => `<label class="setup-option"><input class="interview-category" type="checkbox" value="${escapeHtml(category)}" checked> <span>${escapeHtml(category)} <small class="muted">(${QUESTIONS.filter(q => q.category === category).length})</small></span></label>`).join("");
  }
  function closeDrawer() { document.body.classList.remove("drawer-open"); }
  function trapInterviewFocus(event) {
    const modal = document.getElementById("interviewModal");
    if (modal.hidden || event.key !== "Tab") return;
    const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')]
      .filter(element => !element.closest("[hidden]") && element.getClientRects().length);
    if (!focusable.length) { event.preventDefault(); document.getElementById("closeInterviewBtn").focus(); return; }
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
  }

  document.getElementById("questionList").addEventListener("click", event => {
    const target = event.target.closest("[data-action]"); if (!target) return;
    const { action, id, value } = target.dataset;
    if (action === "answer") {
      const open = !memory.expandedAnswers.has(id);
      open ? memory.expandedAnswers.add(id) : memory.expandedAnswers.delete(id);
      target.closest(".card").querySelector(".answer-panel").hidden = !open;
      target.textContent = open ? "收起答案" : "显示答案";
    }
    if (action === "detail") {
      const open = !memory.expandedDetails.has(id);
      open ? memory.expandedDetails.add(id) : memory.expandedDetails.delete(id);
      target.closest(".answer-panel").querySelector(".detail-block").hidden = !open;
      target.textContent = open ? "收起详细解析" : "展开详细解析";
    }
    if (action === "favorite") toggleFavorite(id);
    if (action === "status") setStatus(id, value);
    if (action === "reset") resetFilters();
  });
  document.getElementById("categoryNav").addEventListener("click", event => {
    const jump = event.target.closest("[data-jump]"); if (!jump) return;
    memory.category = byId.get(jump.dataset.jump).category; renderSidebar(); renderQuestions(); closeDrawer();
    requestAnimationFrame(() => document.getElementById(`q-${jump.dataset.jump}`)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  });
  document.getElementById("categoryNav").addEventListener("toggle", event => {
    const details = event.target.closest("[data-category-group]"); if (!details) return;
    state.openCategories[details.dataset.categoryGroup] = details.open; saveState();
  }, true);
  document.querySelector(".side-special").addEventListener("click", event => { const btn = event.target.closest("[data-nav]"); if (!btn) return; memory.category = btn.dataset.nav; renderSidebar(); renderQuestions(); closeDrawer(); window.scrollTo({top:0,behavior:"smooth"}); });
  document.getElementById("searchInput").addEventListener("input", event => {
    const value = event.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { memory.search = value; renderQuestions(); }, 140);
  });
  document.getElementById("frequencyFilter").addEventListener("change", event => { memory.minFrequency = Number(event.target.value); renderQuestions(); });
  document.getElementById("statusFilter").addEventListener("change", event => { memory.status = event.target.value; renderQuestions(); });
  document.getElementById("favoriteOnly").addEventListener("change", event => { memory.favoriteOnly = event.target.checked; renderQuestions(); });
  document.getElementById("expandAllBtn").addEventListener("click", () => { filteredQuestions().forEach(q => memory.expandedAnswers.add(q.id)); renderQuestions(); });
  document.getElementById("collapseAllBtn").addEventListener("click", () => { filteredQuestions().forEach(q => { memory.expandedAnswers.delete(q.id); memory.expandedDetails.delete(q.id); }); renderQuestions(); });
  document.getElementById("resetFiltersBtn").addEventListener("click", resetFilters);
  document.getElementById("mobileFilterToggle").addEventListener("click", event => {
    const toolbar = event.currentTarget.closest(".toolbar");
    const open = toolbar.classList.toggle("filters-open");
    event.currentTarget.setAttribute("aria-expanded", String(open));
    event.currentTarget.textContent = open ? "收起筛选与批量操作" : "筛选与批量操作";
  });
  document.getElementById("themeBtn").addEventListener("click", cycleTheme);
  document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer-open"));
  document.getElementById("drawerMask").addEventListener("click", closeDrawer);
  document.getElementById("openInterviewBtn").addEventListener("click", openInterview);
  document.getElementById("closeInterviewBtn").addEventListener("click", closeInterview);
  document.getElementById("startInterviewBtn").addEventListener("click", startInterview);
  document.getElementById("revealInterviewBtn").addEventListener("click", revealInterview);
  document.getElementById("nextInterviewBtn").addEventListener("click", nextInterview);
  document.getElementById("restartInterviewBtn").addEventListener("click", resetInterviewSession);
  document.getElementById("closeSummaryBtn").addEventListener("click", closeInterview);
  document.getElementById("selectAllInterview").addEventListener("change", event => document.querySelectorAll(".interview-category").forEach(input => input.checked = event.target.checked));
  document.getElementById("interviewCategories").addEventListener("change", () => { const all = [...document.querySelectorAll(".interview-category")]; document.getElementById("selectAllInterview").checked = all.every(input => input.checked); document.getElementById("selectAllInterview").indeterminate = all.some(input => input.checked) && !all.every(input => input.checked); });
  document.getElementById("interviewStatus").addEventListener("click", event => {
    const btn = event.target.closest("[data-action=status]"); if (!btn || getStatus(btn.dataset.id) === btn.dataset.value) return;
    memory.interviewSession.marked[btn.dataset.id] = btn.dataset.value;
    setStatus(btn.dataset.id, btn.dataset.value);
    document.getElementById("interviewStatus").querySelectorAll('[data-action="status"]').forEach(button => button.classList.toggle("active", button.dataset.value === btn.dataset.value));
  });
  document.getElementById("interviewFavorite").addEventListener("click", () => {
    const q = currentInterview(); if (!q) return; toggleFavorite(q.id);
    const button = document.getElementById("interviewFavorite"), active = isFavorite(q.id);
    button.innerHTML = starIcon(active); button.classList.toggle("active", active); button.setAttribute("aria-label", active ? "取消收藏" : "收藏此题");
  });
  document.addEventListener("keydown", event => {
    trapInterviewFocus(event);
    if (event.key !== "Escape") return;
    if (!document.getElementById("interviewModal").hidden) {
      if (event.target?.tagName === "SELECT") return;
      event.preventDefault(); closeInterview();
    } else closeDrawer();
  });
  const themeMedia = matchMedia("(prefers-color-scheme: dark)");
  const handleSystemThemeChange = () => { if (state.theme === "system") applyTheme(); };
  if (themeMedia.addEventListener) themeMedia.addEventListener("change", handleSystemThemeChange);
  else if (themeMedia.addListener) themeMedia.addListener(handleSystemThemeChange);
  let scrollTimer;
  function captureLastPosition() {
    const visible = [...document.querySelectorAll("[data-question-id]")].filter(card => card.getBoundingClientRect().top <= 160).pop();
    return { questionId: visible?.dataset.questionId || state.last.questionId, scrollY: Math.round(window.scrollY) };
  }
  function lastPositionChanged(next) { return next.questionId !== lastPersistedPosition.questionId || Math.abs(next.scrollY - lastPersistedPosition.scrollY) >= 320; }
  window.addEventListener("scroll", () => {
    clearTimeout(scrollTimer); scrollTimer = setTimeout(() => {
      const next = captureLastPosition(); state.last = next; if (lastPositionChanged(next)) saveState();
    }, 650);
  }, { passive: true });
  window.addEventListener("beforeunload", () => {
    clearTimeout(scrollTimer); const next = captureLastPosition(); state.last = next; if (lastPositionChanged(next)) saveState();
  });

  applyTheme(); setupInterviewCategories(); renderAll(); if (!storageHealthy) setStorageHealth(false);
  requestAnimationFrame(() => {
    if (state.last.questionId && document.getElementById(`q-${state.last.questionId}`)) document.getElementById(`q-${state.last.questionId}`).scrollIntoView({ block: "start" });
    else if (state.last.scrollY) window.scrollTo(0, state.last.scrollY);
  });
  </script>
</body>
</html>
